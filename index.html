 starobnom dôchodkovom sporení zapísanú v registri zmlúv","fyzická osoba, ktorá má uzatvorenú pracovnú zmluvu a nepretržite pracuje","fyzická osoba, ktorá má uzatvorenú zmluvu so Sociálnou poisťovňou","fyzická osoba, ktorá dosiahla dôchodkový vek","fyzická osoba, ktorá dovŕšila 18 rokov"],["Povinné príspevky sa platia:","na účet Sociálnej poisťovne vedený v Štátnej pokladnici","v príslušnej banke kde má sporiteľ vedený svoj účet","v banke kde má zamestnávateľ vedený účet","priamo v pokladnici dôchodkovej správcovskej spoločnosti","na pošte"],["Osoba zúčastnená na starobnom dôchodkovom sporení je podľa zákona o starobnom dôchodkovom sporení aj fyzická osoba, ktorej sa vypláca úrazová renta podľa zákona o sociálnom poistení a","za ktorú Sociálna poisťovňa platí poistné na starobné poistenie, ak bola sporiteľ pred vznikom nároku na úrazovú rentu","bola sporiteľom pred vznikom nároku na úrazovú rentu","ktorá zaplatila príspevky na starobné dôchodkové sporenie za najmenej 36 mesiacov","za ktorú zdravotná poisťovňa platí poistné na starobné poistenie","ktorá zaplatila príspevky na starobné dôchodkové sporenie za najmenej 24 mesiacov"],["Prvá účasť na starobnom dôchodkovom sporení zaniká podľa zákona o starobnom dôchodkovom sporení","dňom zániku dôchodkového poistenia podľa zákona o sociálnom poistení, ktoré trvalo ku dňu jej vzniku","spätne ku dňu prerušenia prvej účasti, ak toto prerušenie trvalo viac ako dvanásť mesiacov","prvým dňom dvanásteho kalendárneho mesiaca bezprostredne nasledujúceho po mesiaci, v ktorom Sociálna poisťovňa zapísala zmluvu o starobnom dôchodkovom sporení do registra zmlúv o starobnom dôchodkovom sporení, ak do tohto dňa nedošlo k uhradeniu ani jedného príspevku na starobné dôchodkové sporenie","dňom zániku zmluvy o starobnom dôchodkovom sporení z dôvodu vyplatenia dávky odstupné","prvým dňom mesiaca nasledujúceho po mesiaci, v ktorom došlo k zániku dôchodkového poistenia podľa zákona o sociálnom poistení, ktoré trvalo ku dňu jej vzniku"],["Účasť na starobnom dôchodkovom sporení sa podľa zákona o starobnom dôchodkovom prerušuje","v období, v ktorom sa prerušuje aj povinné dôchodkové poistenie podľa zákona o sociálnom poistení","vždy keď o to sporiteľ požiada","vždy keď o tom Sociálna poisťovňa právoplatne rozhodne","účasť na starobnom dôchodkovom sporení nie je možné prerušiť","vždy keď nie je poukázaný príspevok na starobné dôchodkové sporenie"],["Sporiteľom podľa zákona o starobnom dôchodkovom sporení je","fyzická osoba, ktorá má uzatvorenú dohodu o vyplácaní starobného dôchodku programovým výberom","fyzická osoba, ktorá požiadala o zápis do registra sporiteľov","fyzická osoba, ktorá si platí zdravotné poistenie","fyzická osoba, ktorá má platnú pracovnú zmluvu","každá fyzická osoba, ktorá si platí povinné odvody do Sociálnej poisťovne"],["Spôsobilosť fyzickej osoby v právnych vzťahoch starobného dôchodkového sporenia je","spôsobilosť fyzickej osoby v právnych vzťahoch sociálneho poistenia podľa zákona o sociálnom poistení","podľa Zákonníka práce","podľa zákona o doplnkovom dôchodkovom sporení","podľa Obchodného zákonníka","mať práva a povinnosti podľa Občianskeho zákonníka"],["Druhy príspevkov na starobné dôchodkové sporenie sú","povinné príspevky na starobné dôchodkové sporenie a dobrovoľné príspevky na starobné dôchodkové sporenie","iba povinné príspevky na starobné dôchodkové sporenie","iba dobrovoľné príspevky na starobné dôchodkové sporenie","zamestnávateľské príspevky","zamestnanecké príspevky"],["Povinné príspevky na starobné dôchodkové sporenie platí","zamestnávateľ za svojho zamestnanca zúčastneného na starobnom dôchodkovom sporení","zamestnanec","študent z dohôd o brigádnickej práci študentov","osoba zúčastnená na starobnom dôchodkovom sporení počas obdobia riadnej starostlivosti o dieťa do šiestich rokov jeho veku","úrad práce za dobrovoľne nezamestnanú osobu zúčastnenú na starobnom dôchodkovom sporení"],["Suma povinných príspevkov sa určuje","percentuálnou sadzbou z vymeriavacieho základu dosiahnutého v rozhodujúcom období","pevnou sumou z vymeriavacieho základu dosiahnutého v rozhodujúcom období akú si určí sporiteľ","dohodou medzi sporiteľom a dôchodkovou správcovskou spoločnosťou","percentuálnou sadzbou určenou zamestnávateľom","percentuálnou sadzbou určenou Sociálnou poisťovňou"],["Dobrovoľné príspevky na starobné dôchodkové sporenie za zamestnanca odvádza","jeho zamestnávateľ, ak sa na tom so zamestnancom dohodol","príslušný Úrad práce","Sociálna poisťovňa","štát","nikto, nakoľko dobrovoľné príspevky na starobné dôchodkové sporenie nie sú prípustné"],["Zo starobného dôchodkového sporenia sa za podmienok ustanovených zákonom o starobnom dôchodkovom sporení vypláca starobný dôchodok a predčasný starobný dôchodok, a to formou","doživotného dôchodku, dočasného dôchodku, programového výberu","jednorazovej výplaty dávky","dočasnej výplaty","určenej Sociálnou poisťovňou","doplnkového dôchodku určeného Ministerstvom financií podľa stavu štátneho rozpočtu"],["Starobný dôchodok sa vypláca","najskôr od prvého dňa kalendárneho mesiaca, v ktorom sporiteľ dovŕšil dôchodkový vek","najskôr ku dňu podania žiadosti o vyplácanie predčasného starobného dôchodku","najskôr od prvého dňa kalendárneho mesiaca, v ktorom mu bol priznaný predčasný starobný dôchodok podľa zákona o sociálnom poistení","odo dňa, kedy sporil v rámci starobného dôchodkového sporenia nepretržite minimálne 5 rokov","odo dňa bezprostredne nasledujúceho po dni, v ktorom sporiteľ dosiahol vek 55 rokov"],["Starobný dôchodok formou programového výberu vypláca","dôchodková správcovská spoločnosť, s ktorou uzatvoril sporiteľ dohodu o vyplácaní dôchodku programovým výberom","sporiteľom určená poisťovňa","poisťovňa určená Sociálnou poisťovňou","Sociálna poisťovňa","zamestnávateľ sporiteľa"],["Aktuálna hodnota osobného dôchodkového účtu zomretého sporiteľa v starobnom dôchodkovom sporení sa vyplatí","oprávnenej osobe, ktorú sporiteľ určil v zmluve o starobnom dôchodkovom sporení","je vždy predmetom dedenia bez ohľadu na existenciu oprávnenej osoby","je predmetom súdneho konania","je predmetom dedenia, avšak až po zúčtovaní odplaty za vysporiadanie majetku po zomretom sporiteľovi","nie je predmetom dedenia, nakoľko sa z nej vyplácajú pozostalostné dôchodky"],["Žiadosť o starobný dôchodok podáva","sporiteľ bezplatne","zamestnávateľ sporiteľa","oprávnená osoba určená sporiteľom v zmluve o starobnom dôchodkovom sporení","zamestnanec dôchodkovej správcovskej spoločnosti","zamestnanec poisťovne"],["Dávky zo starobného dôchodkového sporenia môže vyplácať","dôchodková správcovská spoločnosť a príslušná poisťovňa v prípade, že vypláca doživotný starobný dôchodok alebo doživotný predčasný starobný dôchodok, prípadne pozostalostných dôchodok","výlučne dôchodková správcovská spoločnosť","výlučne poisťovňa","Sociálna poisťovňa","Štátna pokladnica"],["Možno dohodnúť vyplácanie starobného dôchodku a predčasného starobného dôchodku programovým výberom aj vtedy, ak je aktuálna hodnota osobného dôchodkového účtu sporiteľa tvorená z dobrovoľných príspevkov?","áno, na vyplácanie možno použiť sumu zodpovedajúcu aktuálnej hodnote dôchodkových jednotiek pripísaných z dobrovoľných príspevkov alebo jej časť","nie, na vyplácanie nemožno použiť sumu zodpovedajúcu aktuálnej hodnote dôchodkových jednotiek pripísaných z dobrovoľných príspevkov","nie, ak táto suma nie je vyššia ako priemerná mzda v národnom hospodárstve","áno, na vyplácanie možno použiť maximálne sumu zodpovedajúcu 1,5 násobku životného minima podľa osobitného predpisu","nie, ak sa na tom zmluvné strany nedohodli"],["Povinné príspevky sa platia","bezhotovostným prevodom","vkladom na účet Sociálnej poisťovni v Štátnej pokladnici","vkladom na účet dôchodkovej správcovskej spoločnosti","v hotovosti na pobočke dôchodkovej správcovskej spoločnosti","v hotovosti u zamestnávateľa"],["Sirotský dôchodok po poberateľovi doživotného starobného dôchodku alebo poberateľovi doživotného predčasného dôchodku vypláca","poistiteľ","príslušná dôchodková správcovská spoločnosť","Sociálna poisťovňa","Ministerstvo financií Slovenskej republiky","Národná banka Slovenska"],["V systéme dôchodkového zabezpečenia v Slovenskej republike sa zvykne starobné dôchodkové sporenie označovať aj ako","II. pilier dôchodkového zabezpečenia","I. pilier dôchodkového zabezpečenia","III. pilier dôchodkového zabezpečenia","dobrovoľne - zamestnanecký pilier dôchodkového zabezpečenia","dôchodkovo-poistný pilier dôchodkového zabezpečenia"],["Vdovský (vdovecký) dôchodok po poberateľovi doživotného starobného dôchodku alebo poberateľovi doživotného predčasného starobného dôchodku vypláca","poistiteľ","príslušná dôchodková správcovská spoločnosť","Sociálna poisťovňa","Ministerstvo financií Slovenskej republiky","Národná banka Slovenska"],["Každý dôchodkový fond spravovaný príslušnou dôchodkovou správcovskou spoločnosťou musí mať","štatút","všeobecné obchodné podmienky","písomné predajné podmienky","predajný prospekt","poistné podmienky"],["Dohľad nad činnosťou dôchodkových správcovských spoločností vykonáva","Národná banka Slovenska","Ministerstvo financií Slovenskej republiky","Ministerstvo práce, sociálnych vecí a rodiny Slovenskej republiky","Sociálna poisťovňa","Asociácia dôchodkových správcovských spoločností"],["Dôchodková správcovská spoločnosť je","akciová spoločnosť so sídlom na území Slovenskej republiky, ktorej predmetom činnosti je vytváranie a správa dôchodkových fondov na vykonávanie starobného dôchodkového sporenia, a to na základe povolenia na vznik a činnosť udeleného Národnou bankou Slovenska","obchodná spoločnosť, ktorej predmetom činnosti je poskytovanie jednej alebo viacerých investičných služieb na základe povolenia udeleného Národnou bankou Slovenska","právnická osoba, ak predmetom jej činnosti je investovanie do finančných nástrojov","akciová spoločnosť bez udelenia povolenia Národnej banky Slovenska, ak je súčasťou konsolidovaného celku","finančná holdingová inštitúcia, ktorá pôsobí najmenej jeden rok vo finančnom sek "ktorý si o to písomne požiada Sociálnu poisťovňu"],["Zrušiť sa s likvidáciou je dôchodková správcovská spoločnosť povinná bez zbytočného odkladu, ak","nezačne vytvárať a spravovať jeden dlhopisový garantovaný dôchodkový fond a jeden indexový  negarantovaný dôchodkový fond v   lehote šiestich mesiacov od zápisu do obchodného registra","nezačne vytvárať a spravovať jeden vyvážený garantovaný dôchodkový fond a jeden akciový negarantovaný dôchodkový fond v lehote šiestich mesiacov od zápisu do obchodného registra","spravuje menej ako štyri dôchodkové fondy po uplynutí roku od zápisu do            obchodného registra","nezačne vytvárať a spravovať jeden vyvážený dôchodkový fond, jeden indexový dôchodkový fond a jeden zmiešaný dôchodkový fond v lehote šiestich mesiacov od zápisu do obchodného registra","e. nezačne vytvárať a       spravovať jeden zmiešaný dôchodkový fond a jeden akciový dôchodkový fond v lehote ôsmich mesiacov od zápisu do obchodného registra"],["Pri zlúčení jednej dôchodkovej správcovskej spoločnosti s inou dôchodkovou správcovskou spoločnosťou","je zakázané zlúčiť indexový negarantovaný dôchodkový fond s iným ako indexovým negarantovaným dôchodkovým fondom","je možné zlúčiť akciový negarantovaný dôchodkový fond s dlhopisovým             garantovaným dôchodkovým fondom","je zakázané zlúčiť dôchodkové fondy s rovnakou investičnou stratégiou","je možné zlúčiť indexový negarantovaný dôchodkový fond s dlhopisovým             garantovaným dôchodkovým fondom","je zakázané zlúčiť dlhopisový garantovaný dôchodkový fond s iným dlhopisovým garantovaným dôchodkovým fondom"],["Sporiteľ v predvolenej investičnej stratégii je sporiteľ","ktorému vznikla prvá účasť na starobnom dôchodkovom sporení","ktorý nedoručí písomný prejav vôle byť zúčastnený v predvolenej investičnej stratégii svojej dôchodkovej správcovskej spoločnosti","ktorý  dovŕši potrebný vek na takúto stratégiu","ktorý je označený za kvalifikovaného investora podľa dotazníka o vhodnosti","ktorý má nasporenú dostatočnú sumu na svojom osobnom dôchodkovom účte"]]}];
const KEY = "nbs-kviz-v1";
const LEVEL_KEY = "nbs-kviz-level";
const AUTO_NEXT_MS = 650;

/* Stupne: stredný = otázky strednej náročnosti; vyšší a najvyšší (písomná časť) = stredná + vyššia náročnosť. */
const LEVELS = [
  { id: "s", pool: "s", name: "Stredný", long: "stredný stupeň" },
  { id: "v", pool: "v", name: "Vyšší", long: "vyšší stupeň" },
  { id: "n", pool: "v", name: "Najvyšší", long: "najvyšší stupeň (s certifikátom)" }
];

let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
/* starší uložený postup (len stredný stupeň) presunúť pod nový kľúč */
DATA.forEach(c => { if (store[c.id] && !store["s:" + c.id]) { store["s:" + c.id] = store[c.id]; } delete store[c.id]; });
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

let level = "s";
try { const l = localStorage.getItem(LEVEL_KEY); if (LEVELS.some(x => x.id === l)) level = l; } catch (e) {}
function lv() { return LEVELS.find(x => x.id === level); }
function setLevel(id) { level = id; try { localStorage.setItem(LEVEL_KEY, id); } catch (e) {} render(); }

const app = document.getElementById("app");
let view = { name: "home" };   // home | quiz | summary
let cur = null;                // { opts:[{t,ok}], picked:null|index }
let timer = null;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function cat(id) { return DATA.find(c => c.id === id); }
function pool(id) { const c = cat(id); return lv().pool === "v" ? c.q.concat(c.q2) : c.q; }
function skey(id) { return lv().pool + ":" + id; }
function S(id) { return store[skey(id)]; }
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }

function newRound(id, indexes, round) {
  const prev = S(id);
  store[skey(id)] = { round: round, queue: shuffle(indexes.slice()), pos: 0, wrong: [], done: false, first: prev && prev.first || null };
  save();
}
function startFull(id) { delete store[skey(id)]; newRound(id, pool(id).map((_, i) => i), 1); openQuiz(id); }
function startWrong(id) { const s = S(id); newRound(id, s.wrong.map(w => w[0]), s.round + 1); openQuiz(id); }

function openQuiz(id) { view = { name: "quiz", id: id }; cur = null; render(); window.scrollTo(0, 0); }
function openSummary(id) { view = { name: "summary", id: id }; render(); window.scrollTo(0, 0); }
function goHome() { clearTimeout(timer); view = { name: "home" }; render(); window.scrollTo(0, 0); }

function makeOptions(q) {
  const wrong = shuffle(q.slice(2)).slice(0, 2);
  return shuffle([{ t: q[1], ok: true }, { t: wrong[0], ok: false }, { t: wrong[1], ok: false }]);
}

function pick(i) {
  if (!cur || cur.picked !== null) return;
  const s = S(view.id), qi = s.queue[s.pos];
  cur.picked = i;
  if (!cur.opts[i].ok) s.wrong.push([qi, cur.opts[i].t]);
  save();
  render();
  if (cur.opts[i].ok) timer = setTimeout(next, AUTO_NEXT_MS);
}
function next() {
  clearTimeout(timer);
  const s = S(view.id);
  if (!cur || cur.picked === null) return;
  s.pos += 1; cur = null;
  if (s.pos >= s.queue.length) {
    s.done = true;
    if (s.round === 1) s.first = { ok: s.queue.length - s.wrong.length, n: s.queue.length };
    save(); openSummary(view.id); return;
  }
  save(); render();
}

/* ---------- obrazovky ---------- */
function renderHome() {
  const total = DATA.reduce((a, c) => a + pool(c.id).length, 0);
  const L = lv();
  const note = L.id === "s" ? "Otázky strednej náročnosti."
    : L.id === "v" ? "Na vyšší stupeň sa skúšajú otázky strednej aj vyššej náročnosti, preto sú tu obe skupiny spolu."
    : "Písomná časť skúšky s certifikátom sa skladá z tých istých otázok ako vyšší stupeň, postup je s ním spoločný. Otázky na ústnu časť NBS nezverejňuje.";
  app.append(el(`<header><p class="eyebrow">Odborná skúška NBS</p><h1>Kvíz podľa sektorov</h1></header>`));
  const seg = el(`<div class="levels" role="group" aria-label="Stupeň odbornej spôsobilosti">${LEVELS.map(x => `<button type="button" class="lvl${x.id === level ? " on" : ""}" data-l="${x.id}" aria-pressed="${x.id === level}">${x.name}</button>`).join("")}</div>`);
  seg.addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.l !== level) setLevel(b.dataset.l); });
  app.append(seg);
  app.append(el(`<p class="muted"><b class="num">${total.toLocaleString("sk-SK")}</b> otázok pre ${esc(L.long)} z databázy NBS platnej od 18.12.2025. ${note} Pri každej otázke sú tri možnosti, jedna je správna. Po dokončení sektora uvidíš chyby a môžeš si z nich spustiť nový test.</p>`));
  const list = el(`<div class="cats"></div>`);
  DATA.forEach(c => {
    const s = S(c.id), n = pool(c.id).length;
    let state = `<span class="state">Ešte nezačaté</span>`, actions = `<button class="btn" data-a="full">Začať</button>`;
    if (s && !s.done) {
      state = `<span class="state"><span class="pill run">Rozpracované</span> otázka <b class="num">${s.pos + 1}</b> z <b class="num">${s.queue.length}</b>${s.round > 1 ? ` · test z chýb, kolo ${s.round}` : ""}</span>`;
      actions = `<button class="btn" data-a="resume">Pokračovať</button><button class="btn ghost" data-a="ask">Odznova</button>`;
    } else if (s && s.done && s.wrong.length) {
      state = `<span class="state"><span class="pill bad">${s.wrong.length} ${chyb(s.wrong.length)}</span> ${firstLine(s)}</span>`;
      actions = `<button class="btn" data-a="wrong">Test z chýb (${s.wrong.length})</button><button class="btn ghost" data-a="sum">Zhrnutie</button><button class="btn ghost" data-a="ask">Odznova</button>`;
    } else if (s && s.done) {
      state = `<span class="state"><span class="pill good">Zvládnuté</span> ${firstLine(s)}</span>`;
      actions = `<button class="btn ghost" data-a="full">Celý sektor odznova</button>`;
    }
    const card = el(`<section class="cat"><div class="cat-head"><div><h2>${esc(c.name)}</h2><p class="muted">${esc(c.sub)}</p></div><span class="cat-count num">${n} otázok</span></div>${state}<div class="row">${actions}</div></section>`);
    card.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const a = b.dataset.a;
      if (a === "full" || a === "yes") startFull(c.id);
      else if (a === "resume") openQuiz(c.id);
      else if (a === "wrong") startWrong(c.id);
      else if (a === "sum") openSummary(c.id);
      else if (a === "no") render();
      else if (a === "ask") { card.querySelector(".row").innerHTML = `<span class="state">Začať celý sektor odznova? Doterajší postup sa zmaže.</span><button class="btn danger" data-a="yes">Áno, odznova</button><button class="btn ghost" data-a="no">Nie</button>`; }
    });
    list.append(card);
  });
  app.append(list);
  app.append(el(`<p class="muted">Postup sa ukladá len v tomto prehliadači, zvlášť pre stredný a pre vyšší stupeň. Zdroj otázok: regfap.nbs.sk/skusky/otazky.</p>`));
}
function chyb(n) { return n === 1 ? "chyba" : (n >= 2 && n <= 4 ? "chyby" : "chýb"); }
function firstLine(s) { return s.first ? `· prvý prechod <b class="num">${s.first.ok}</b> z <b class="num">${s.first.n}</b> správne` : ""; }

function renderQuiz() {
  const s = S(view.id), c = cat(view.id);
  if (!s || s.done) { goHome(); return; }
  const q = pool(view.id)[s.queue[s.pos]];
  if (!cur) cur = { opts: makeOptions(q), picked: null };
  const answered = cur.picked !== null, okPick = answered && cur.opts[cur.picked].ok;
  const pct = Math.round((s.pos + (answered ? 1 : 0)) / s.queue.length * 100);
  app.append(el(`<div class="top"><div><p class="eyebrow">${esc(c.name)} · ${esc(lv().name.toLowerCase())} stupeň${s.round > 1 ? " · test z chýb" : ""}</p><p class="muted num">Otázka ${s.pos + 1} z ${s.queue.length} · chýb ${s.wrong.length}</p></div><button class="btn ghost" id="quit">Sektory</button></div>`));
  app.append(el(`<div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>`));
  const card = el(`<section class="card"><p class="qtext">${esc(q[0])}</p><div class="opts"></div></section>`);
  const opts = card.querySelector(".opts");
  cur.opts.forEach((o, i) => {
    let cls = "opt";
    if (answered && o.ok) cls += " ok";
    if (answered && i === cur.picked && !o.ok) cls += " no";
    const b = el(`<button class="${cls}" ${answered ? "disabled" : ""}><span class="k">${"ABC"[i]}</span><span class="t">${esc(o.t)}</span></button>`);
    b.addEventListener("click", () => pick(i));
    opts.append(b);
  });
  if (answered) {
    card.append(el(`<p class="verdict ${okPick ? "good" : "bad"}">${okPick ? "Správne" : "Nesprávne. Správna odpoveď je zvýraznená zelenou."}</p>`));
    if (!okPick) { const n = el(`<div class="row"><button class="btn" id="next">${s.pos + 1 >= s.queue.length ? "Zobraziť zhrnutie" : "Ďalšia otázka"}</button></div>`); card.append(n); }
  }
  app.append(card);
  app.append(el(`<p class="muted">Klávesy 1, 2, 3 vyberú odpoveď, Enter prejde ďalej.</p>`));
  document.getElementById("quit").addEventListener("click", goHome);
  const nb = document.getElementById("next"); if (nb) { nb.addEventListener("click", next); nb.focus(); }
}

function renderSummary() {
  const s = S(view.id), c = cat(view.id), P = pool(view.id);
  if (!s || !s.done) { goHome(); return; }
  const n = s.queue.length, bad = s.wrong.length, ok = n - bad;
  app.append(el(`<header><p class="eyebrow">${esc(c.name)} · ${esc(lv().name.toLowerCase())} stupeň · ${s.round > 1 ? "test z chýb, kolo " + s.round : "celý sektor"}</p><h1>Zhrnutie</h1></header>`));
  app.append(el(`<section class="card"><div class="score"><span class="big num">${ok} / ${n}</span><span class="muted">správne · ${Math.round(ok / n * 100)} %</span></div>
    <p>${bad ? `Nesprávne si odpovedal na <b class="num">${bad}</b> ${bad === 1 ? "otázku" : (bad <= 4 ? "otázky" : "otázok")}. Nový test bude obsahovať len tieto otázky.` : "Všetky otázky v tomto teste si zodpovedal správne."}</p>
    <div class="row">${bad ? `<button class="btn" id="again">Nový test z chýb (${bad})</button>` : ""}<button class="btn ghost" id="home">Späť na sektory</button><button class="btn ghost" id="full">Celý sektor odznova</button></div></section>`));
  if (bad) {
    app.append(el(`<h2>Čo bolo zle</h2>`));
    const list = el(`<div class="wrongs"></div>`);
    s.wrong.forEach(([qi, chosen], i) => {
      const q = P[qi];
      list.append(el(`<article class="w"><p class="q"><span class="num">${i + 1}.</span> ${esc(q[0])}</p><dl class="ans"><dt class="bad">Tvoja odpoveď</dt><dd class="bad">${esc(chosen)}</dd><dt class="good">Správne</dt><dd class="good">${esc(q[1])}</dd></dl></article>`));
    });
    app.append(list);
  }
  const a = document.getElementById("again"); if (a) a.addEventListener("click", () => startWrong(view.id));
  document.getElementById("home").addEventListener("click", goHome);
  document.getElementById("full").addEventListener("click", () => startFull(view.id));
}

function render() {
  app.innerHTML = "";
  if (view.name === "quiz") renderQuiz();
  else if (view.name === "summary") renderSummary();
  else renderHome();
}

document.addEventListener("keydown", e => {
  if (view.name !== "quiz" || !cur) return;
  if (cur.picked === null && ["1", "2", "3"].includes(e.key)) { pick(Number(e.key) - 1); e.preventDefault(); }
  else if (cur.picked !== null && e.key === "Enter") { next(); e.preventDefault(); }
});

/* ---------- nočný režim ---------- */
const THEME_KEY = "nbs-kviz-theme";
const rootEl = document.documentElement;
function isDark() {
  const t = rootEl.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function paintToggle() {
  const d = isDark();
  document.getElementById("theme-label").textContent = d ? "Denný režim" : "Nočný režim";
  document.getElementById("theme").setAttribute("aria-pressed", d ? "true" : "false");
}
try { const saved = localStorage.getItem(THEME_KEY); if (saved === "dark" || saved === "light") rootEl.setAttribute("data-theme", saved); } catch (e) {}
document.getElementById("theme").addEventListener("click", () => {
  const nextTheme = isDark() ? "light" : "dark";
  rootEl.setAttribute("data-theme", nextTheme);
  try { localStorage.setItem(THEME_KEY, nextTheme); } catch (e) {}
  paintToggle();
});
paintToggle();

render();
</script>

</body>
</html>
