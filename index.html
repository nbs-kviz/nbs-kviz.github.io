<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NBS skúškový kvíz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a flash-card deck; sector list -> question card -> summary sheet. */
:root {
  --bg: #F3FAFB;          /* svetlý tyrkysový podklad */
  --surface: #FFFFFF;
  --fg: #00191C;          /* Simplea takmer čierna petrolejová */
  --muted: #5B6B6E;
  --line: #CFE6EA;
  --accent: #00ABBD;      /* Simplea tyrkysová */
  --accent-fg: #00191C;
  --accent-text: #006771; /* tyrkysová na text */
  --accent-soft: #D3ECEF;
  --warm: #FF6319;        /* Simplea oranžová */
  --warm-soft: #FFE6D9;
  --warm-text: #B8400A;
  --good: #1B7F3B;
  --good-soft: #DDF3E3;
  --bad: #C8402B;
  --bad-soft: #FBE3DE;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", "Poppins", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #00191C; --surface: #06282D; --fg: #E8F6F8; --muted: #9BB9BE; --line: #17454D;
    --accent: #26B8C7; --accent-fg: #00191C; --accent-text: #4DC4D1; --accent-soft: #0C3A42;
    --warm: #FF7A3D; --warm-soft: #40200F; --warm-text: #FFB08A;
    --good: #5BD487; --good-soft: #12382A; --bad: #F58A76; --bad-soft: #45201A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #00191C; --surface: #06282D; --fg: #E8F6F8; --muted: #9BB9BE; --line: #17454D;
    --accent: #26B8C7; --accent-fg: #00191C; --accent-text: #4DC4D1; --accent-soft: #0C3A42;
    --warm: #FF7A3D; --warm-soft: #40200F; --warm-text: #FFB08A;
    --good: #5BD487; --good-soft: #12382A; --bad: #F58A76; --bad-soft: #45201A;
    color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 680px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-size: 2.1rem; font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; text-transform: uppercase; letter-spacing: 0.01em; }
h2 { font-size: 1.08rem; font-weight: 600; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); font-size: 0.9rem; }
.eyebrow { font-size: 0.74rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent-text); }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: 0.04em; text-transform: uppercase; }
.brand i { font-style: normal; color: var(--accent-text); }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 14px; border-radius: 999px; font-size: 0.86rem; font-weight: 500; color: var(--fg); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); }
.toggle .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--warm); box-shadow: inset -4px -2px 0 0 var(--surface); }
:root[data-theme="dark"] .toggle .dot { box-shadow: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toggle .dot { box-shadow: none; } }
.num { font-variant-numeric: tabular-nums; }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 18px; border-radius: 999px; font-weight: 600; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; color: var(--accent-text); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: var(--bad); color: var(--surface); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.levels { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--accent-soft); }
.lvl { flex: 1 1 0; min-width: 0; min-height: 42px; padding: 8px 10px; border-radius: 999px; font-weight: 500; color: var(--accent-text); -webkit-tap-highlight-color: transparent; }
.lvl.on { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 25, 28, 0.18); }
/* sektory */
.cats { display: flex; flex-direction: column; gap: 10px; }
.cat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.cat-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.cat-head > div { min-width: 0; }
.cat-count { font-weight: 600; color: var(--muted); white-space: nowrap; }
.state { font-size: 0.9rem; color: var(--muted); }
.state b { color: var(--fg); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.run { background: var(--warm-soft); color: var(--warm-text); }

/* otázka */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.bar { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.qtext { font-size: 1.1rem; font-weight: 600; text-wrap: pretty; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; width: 100%; padding: 14px 14px; border-radius: 12px; background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--line); display: flex; gap: 12px; align-items: flex-start; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-weight: 600; font-size: 0.85rem; display: grid; place-items: center; }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
@media (hover: hover) and (pointer: fine) { .opt:not([disabled]):hover { box-shadow: inset 0 0 0 2px var(--accent); } }
.opt[disabled] { cursor: default; }
.opt { -webkit-tap-highlight-color: transparent; }
.opt:focus:not(:focus-visible) { outline: none; }
.opt.ok { background: var(--good-soft); box-shadow: inset 0 0 0 2px var(--good); }
.opt.ok .k { background: var(--good); color: var(--surface); }
.opt.no { background: var(--bad-soft); box-shadow: inset 0 0 0 2px var(--bad); }
.opt.no .k { background: var(--bad); color: var(--surface); }
.verdict { font-weight: 600; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }

/* zhrnutie */
.score { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; }
.score .big { font-family: var(--display); font-size: 3.2rem; font-weight: 700; line-height: 1; }
.wrongs { display: flex; flex-direction: column; gap: 10px; }
.w { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.w .q { font-weight: 600; }
.ans { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 0.94rem; }
.ans dt { font-weight: 600; white-space: nowrap; }
.ans dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.ans .bad { color: var(--bad); }
.ans .good { color: var(--good); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <div class="topbar"><span class="brand">NBS <i>kvíz</i></span><button class="toggle" id="theme" type="button" aria-pressed="false"><span class="dot" aria-hidden="true"></span><span id="theme-label">Nočný režim</span></button></div>
  <div class="wrap" id="app"></div>
</div>

podpisom kúpnej alebo inej zmluvy","podpisom kúpnej alebo inej zmluvy s overením podpisov kupujúceho aj predávajúceho pred notárom","spísaním notárskej zápisnice o zmluve o prevode nehnuteľnosti"],["Dlžník je v omeškaní, ak","svoj dlh riadne a včas nesplní","pohľadávku neuhradí","pohľadávku uhradí v deň jej splatnosti","pohľadávku uhradí pred dňom jej splatnosti","svoj dlh prevedie na inú osobu"],["Ktorá z nasledujúcich situácií najviac zodpovedá definícii neobvyklej obchodnej operácie?","klient žiada o uskutočnenie hotovostného vkladu vo výške 50 000 EUR, ktorý následne okamžite prevádza na účet v tretej krajine bez ekonomického dôvodu","podnikateľ si zakladá bežný účet na vedenie každodenných transakcií s dodávateľmi v zahraničí","klient vopred písomne upozorní banku, že plánuje prevod väčšej sumy v súvislosti s predajom nehnuteľnosti","občan realizuje opakovaný výber hotovosti v celkovej sume 1 000 EUR z bankomatu počas víkendu","klient požiada o zrušenie účtu z dôvodu nespokojnosti s výškou poplatkov"],["Ktoré z nasledujúcich konaní predstavuje porušenie nielen porušenie etických princípov pri poskytovaní finančných služieb, ale aj zákonných požiadaviek?","uvádzanie nepravdivých výnosov v marketingovom materiáli","poskytnutie služby na základe úplných informácií","informovanie klienta o rizikách spojených s investíciou","odporúčanie produktu podľa potrieb klienta","overenie finančnej situácie klienta"],["Darovacou zmluvou","darca niečo bezplatne prenecháva alebo sľubuje obdarovanému a ten dar alebo sľub prijíma","darca niečo odplatne prenecháva alebo sľubuje obdarovanému a ten dar alebo sľub prijíma","darca niečo prenecháva alebo sľubuje obdarovanému a ten dar alebo sľub prijíma a zaväzuje sa uhradiť dohodnutú odmenu","darca prenecháva za odplatu obdarovanému vec, aby ju dočasne užíval alebo z nej bral aj úžitky","obdarovaný prenecháva darcovi vec, aby ju užíval alebo z nej bral aj úžitky"],["Ak vec patrí dvom alebo viacerým vlastníkom, ide o","spoluvlastníctvo" bočka banky povinná odmietnuť, resp. môže konať v zmysle udelenia výnimiek uvedených v zákone č. 483/2001 Z. z. o bankách a o zmene a doplnení niektorých zákonov v znení neskorších predpisov","môže banka odmietnuť iba v prípade, ak má pochybnosti o vlastníkovi hotovosti","nesmie banka odmietnuť, každý takýto obchod musí vykonať","môže banka odmietnuť iba v prípade, že má pochybnosti o klientovi, či má dostatok finančných prostriedkov na realizáciu obchodu","by banka nemala odmietnuť, ak je to v prospech klienta"],["Finančná inštitúcia od klienta fyzickej osoby zo zahraničia, ktorá nie je podnikateľom, akceptuje ako identifikačný doklad totožnosti","doklad povolenia na pobyt v SR, pri občanoch EÚ identifikačný preukaz občana EÚ","výhradne len cestovný pas, kde nie je potrebné, aby mal povolenie na dlhodobý pobyt v SR","od týchto osôb finančná inštitúcia nevyžaduje identifikáciu","doklad s fotografiou a v prípade významnejšej transakcie môže požadovať aj povolenie na dlhodobý pobyt v SR","vodičský preukaz"],["Banka požaduje od klienta fyzickej osoby s trvalým pobytom v SR t.j. tuzemca rezidenta ako identifikačný doklad totožnosti","občiansky preukaz, príp. pri jeho strate potvrdenie od polície o strate dokladu spolu s iným hodnoverným dokladom - cestovným pasom","výhradne len cestovný pas občana EÚ","od týchto osôb banka nevyžaduje identifikáciu","akýkoľvek doklad s fotografiou","vodičský preukaz"],["Sú osobné údaje klienta, ktorý už zrušil účet v banke, predmetom ochrany osobných údajov?","áno","nie","áno, ale iba v prípade, že klient podpísal o danej skutočnosti žiadosť","áno, ale iba v prípade, že v banke sú vedené účty jeho rodinných príslušníkov","nie, lebo všetky doklady banka bezprostredne po zrušení účtu zničí"],["Súčasťou bankového tajomstva","sú informácie a doklady týkajúce sa klienta, ktoré nie sú verejne prístupné","nie sú osobné údaje klientov","sú len osobné údaje zamestnancov banky","sú osobné údaje klientov, ale len v prípade VIP klientov","nie sú informácie o klientovi"],["Banka je povinná poskytnúť údaje na identifikáciu klienta aj bez súhlasu klienta","na základe písomnej žiadosti osobe, ktorá preukáže, že v dôsledku chyby pri vykonávaní platobného a zúčtovacieho styku utrpela majetkovú ujmu","vždy","nikdy","len v prípade, že žiadateľom je finančná polícia","ak ide o hľadanú osobu"],["Poskytnúť informácie súdnemu exekútorovi aj bez súhlasu klienta","je banka oprávnená","nie je banka oprávnená","je banka povinná tak, ako ktorémukoľvek inému žiadateľovi","nie je banka oprávnená, musí žiadať súhlas od klienta","je banka oprávnená, ale len s platným exekučným príkazom a telefonickým súhlasom klienta"],["Kódexy etiky v oblasti finančných služieb upravujú predovšetkým","morálne a profesionálne pravidlá správania sa osôb pôsobiacich vo finančnom sektore","záväzné obchodné podmienky platné pre všetky podnikateľské subjekty","Spôsob výpočtu odmien a výkonnostných bonusov zamestnancov","všeobecné pravidlá medziľudského správania v spoločnosti","Právne predpisy upravujúce zverejňovanie informácií o finančných produktoch"],["Zahraničné osoby","môžu podnikať na území Slovenskej republiky za rovnakých podmienok a v rovnakom rozsahu ako slovenské osoby","nemôžu podnikať na území Slovenskej republiky","môžu podnikať na území Slovenskej republiky za splnenia určitých podmienok aj vo väčšom rozsahu ako v domovskom štáte","môžu podnikať na území Slovenskej republiky za rovnakých podmienok a v rovnakom rozsahu ako slovenské osoby, ak sú v trvalom zväzku so slovenskou osobou","nemôžu podnikať na území Slovenskej republiky za rovnakých podmienok a v rovnakom rozsahu ako slovenské osoby, okrem výnimiek uvedených v zákone"]],"q2":[]},{"id":"PaZ","name":"Poistenie alebo zaistenie","sub":"sektor PaZ","q":[["Poisťovníctvo v SR môže byť upravené (regulované)","všeobecne záväznými právnymi predpismi SR a nariadeniami Európskeho parlamentu a Rady, nariadeniami Európskej komisie","výlučne zákonmi prijatými úradom","výlučne smernicami európskeho parlamentu a rady","výlučne nariadeniami Európskej komisie","vyhláškami MF SR a rozhodnutiami súdov"],["Oblasť poisťovníctva legislatívne upravuje najmä","zákon č. 39/2015 Z. z. o poisťovníctve a o zmene a doplnení niektorých zákonov a Občiansky zákonník","zákon o poistnej zmluve a Obchodný zákonník","zákon o poisťovniach a bankách","zákon o poisťovacej činnosti a Občiansky zákonník","zákon o poistnom trhu a Obchodný zákonník"],["Podstatné náležitosti poistných zmlúv v SR upravuje","Občiansky zákonník","Obchodný zákonník","Hospodársky zákonník","Zákon o povinnom zmluvnom poistení zodpovednosti za škodu spôsobenú prevádzkou motorového vozidla","Zákon o finančnom sprostredkovaní a finančnom poradenstve"],["Poisťovňa je","právnická osoba so sídlom na území Slovenskej republiky, ktorá vykonáva poisťovaciu činnosť na základe povolenia na vykonávanie poisťovacej činnosti udeleného Národnou bankou Slovenska v konaní podľa osobitného predpisu","právnická osoba so sídlom na území Slovenskej republiky, ktorá vykonáva poisťovaciu činnosť na základe povolenia vydaného Ministerstvom financií SR","združenie osôb a majetku, ktoré vykonávajú poisťovaciu činnosť na základe povolenia na vykonávanie poisťovacej činnosti udeleného Národnou bankou Slovenska v konaní podľa osobitného predpisu","právnická alebo fyzická osoba, ktorá nevykonáva poisťovaciu činnosť na základe povolenia na vykonávanie poisťovacej činnosti udeleného Národnou bankou Slovenska","fyzická osoba so sídlom na území Slovenskej republiky, ktorá vykonáva poisťovaciu činnosť na základe povolenia vydaného Ministerstvom financií SR"],["Pobočka poisťovne z iného členského štátu je","organizačná zložka poisťovne z iného členského štátu umiestnená na území Slovenskej republiky","organizačná zložka poisťovne, umiestnená na území iného členského štátu","organizačná zložka zaisťovne","organizačná zložka zahraničnej poisťovne, umiestnená na území iného členského štátu","organizačná zložka zaisťovne, umiestnená na území iného členského štátu"],["Regulátorom pre komerčné poisťovníctvo na Slovensku je","inštitúcia, ktorá zodpovedá za tvorbu právnych predpisov v oblasti verejného práva t.j. za zákony o poisťovníctve a zákony o dohľade zodpovedá Ministerstvo financií Slovenskej republiky. Za vykonávacie predpisy - vyhlášky zodpovedá Ministerstvo financií Slovenskej republiky a za opatrenia zodpovedá Národná banka Slovenska; za oblasť súkromného práva zodpovedá Ministerstvo spravodlivosti Slovenskej republiky (najmä Občiansky zákonník a jeho vykonávacie predpisy)","inštitúcia, ktorá vykonáva dohľad nad vykonávaním finančných služieb. Za poisťovníctvo zodpovedá Ministerstvo financií Slovenskej republiky","inštitúcia, zaoberajúca sa mimosúdnym riešením sporov medzi poisťovňou a klientom. Za oblasť verejného práva zodpovedá Ministerstvo financií Slovenskej republiky a za oblasť súkromného práva zodpovedá Ministerstvo spravodlivosti Slovenskej republiky","inštitúcia, ktorá reguluje distribúciu produktov v rámci poistného trhu. Za Slovenskú republiku zodpovedá Slovenský štatistický úrad","inštitúcia, ktorá má právo kontrolovať dodržiavanie predpisov na ochranu spotrebiteľa. V Slovenskej republike je to Slovenská obchodná inšpekcia"],["Poisťovacou činnosťou je","podnikateľská činnosť podľa zákona č. 39/2015 Z. z. o poisťovníctve a o zmene a doplnení niektorých zákonov, ktorou je preberanie poistných rizík od osôb ohrozených rovnakým alebo podobným rizikom, vytváranie a organizovanie poistného kmeňa, vytváranie technických rezerv na všetky záväzky voči oprávneným osobám z poistných zmlúv a plnenie týchto záväzkov za odplatu, ktorá sa určí s použitím poistnej matematiky a štatistiky","činnosť kontaktného miesta, oddelenia správy, oddelenia likvidácie a učtárne","poistenie, zaistenie, spolupoistenie a poisťovací pool","životné a neživotné poistenie","poistenie, spolupoistenie, sprostredkovanie a poradenstvo a spolupráca s Ministerstvom financií SR pri predchádzaní škodám na základe osobitného zákona"],["Zákon č. 39/2015 Z. z. o poisťovníctve a o zmene a doplnení niektorých zákonov upravuje","vznik, organizáciu, riadenie, vykonávanie činnosti, oceňovanie aktív, záväzkov a kapitálových požiadaviek na účely dohľadu, reorganizáciu a zánik poisťovní a zaisťovní, pôsobenie poisťovní a zaisťovní z iných členských štátov EÚ a nečlenských štátov EÚ a výkon dohľadu nad poisťovníctvom","vznik, obsah, zmeny a zánik poistnej zmluvy","vznik, organizáciu, riadenie, vykonávanie činnosti regulátora a dohľadu v poisťovníctve","vznik, organizáciu, riadenie, vykonávanie činnosti poisťovní a sprostredkovateľov v poisťovníctve a výkon dohľadu","vznik, organizáciu, riadenie, vykonávanie činnosti a zánik poisťovní, zaisťovní a Slovenskej kancelárie poisťovateľov"],["Na účely likvidácie poisťovne alebo zaisťovne sa rozumie likvidáciou","proces, ktorý pozostáva zo speňaženia aktív poisťovne alebo zaisťovne a rozdelenia výnosu medzi veriteľov a akcionárov, ktorý zahŕňa zásah príslušných orgánov, vrátane konkurzu, podľa osobitných predpisov","proces, ktorý pozostáva zo speňaženia aktív poisťovne","proces, ktorý pozostáva zo speňaženia aktív zaisťovne","proces, ktorý pozostáva z rozdelenia výnosu medzi veriteľov a akcionárov","proces, ktorý pozostáva zo speňaženia aktív a rozdelenia výnosu medzi veriteľov a akcionárov"],["Poisťovňa je oprávnená vykonávať poisťovaciu činnosť","na základe povolenia Národnej banky Slovenska na vykonávanie poisťovacej činnosti","na základe povolenia Ministerstva financií SR na vznik a vykonávanie činnosti","na základe povolenia vlády SR","zaregistrovaním akciovej spoločnosti na registrovom súde","na základe dohody akcionárov o založení poisťovne"],["Charakteristika povolenia na vykonávanie poisťovacej činnosti","vydáva sa na neurčitú dobu a nemožno ho previesť na inú osobu, neprechádza na právneho zástupcu a vydáva sa vždy iba pre poistný druh životné poistenie alebo pre poistný druh neživotné poistenie","môže sa vydať na určitú dobu a možno ho previesť na inú osobu","môže byť predmetom postúpenia práv a povinnosti na inú spoločnosť","vydáva sa vždy iba pre obidva poistné druhy, t.j. životné a neživotné poistenie spolu","je dočasné a každých päť rokov sa obnovuje, ak o to poisťovňa požiada"],["„Európsky pas“ pre poisťovňu znamená, že","povolenie na vykonávanie poisťovacej činnosti vydané v SR je platné pre všetky členské štáty EÚ alebo pre členské štáty Európskej dohody o voľnom obchode, ktoré podpísali zmluvu o EHS (t.j. poisťovňa môže poskytovať služby v rámci celej EÚ)","povolenie na podnikanie v poisťovníctve vydané v SR je platné pre celý svet okrem Japonska","poisťovňa môže umiestňovať technické rezervy kdekoľvek v Európe","poisťovňa môže poisťovať občanov Európskej únie","povolenie na podnikanie v poisťovníctve musí byť vydané pre všetky členské štáty EÚ iba v Bruseli"],["Poisťovaciu činnosť môže vykonávať","iba poisťovňa, ktorej bolo udelené povolenie na vykonávanie poisťovacej činnosti","poisťovňa, ktorá požiadala o povolenie na vykonávanie poisťovacej činnosti","poisťovňa a zaisťovňa, ktorým bolo udelené povolenie na vykonávanie poisťovacej činnosti","poisťovňa a sprostredkovateľ, ktorým bolo udelené príslušné povolenie","iba poisťovňa, ktorá bola zriadená Ministerstvom financií a ktorej zároveň bolo udelené povolenie na vykonávanie poisťovacej činnosti"],["Poisťovňa môže vykonávať iba","poisťovaciu alebo zaisťovaciu činnosť, na ktorú jej bolo udelené povolenie, činnosti s tým súvisiace a po súhlase Národnej banky Slovenska aj finančné sprostredkovanie","činnosti, na ktoré jej bolo udelené povolenie, činnosti s tým súvisiace a sprostredkovanie a ďalšie činnosti, na ktoré má živnostenské oprávnenie","všetky činnosti, na ktoré jej bolo udelené povolenie Národnej banky Slovenska alebo Ministerstva financií SR, činnosti s tým súvisiace, sprostredkovanie predaja nehnuteľností a ďalšie činnosti, pre ktoré sa manažment rozhodne","všetky činnosti, ktoré umožňuje zákon o poisťovníctve bez ohľadu na udelené povolenie, a"],["Odkupná hodnota vyplácaná pri predčasnom skončení životného poistenia sa pre zistenie základu dane z príjmov znižuje o","zaplatené poistné","rezervu na životné poistenie","kapitálovú hodnotu v dobe výplaty odbytného","polovicu hodnoty poistenia","rezervu poistného, ktorá sa plynutím poistnej doby zhodnocovala"]]},{"id":"KT","name":"Kapitálový trh","sub":"sektor KT","q":[["Ktorý z nasledovných subjektov nepodlieha dohľadu Národnej banky Slovenska?","Emitent cenných papierov vo vzťahu k jeho podnikateľskej činnosti","Podriadený finančný agent","Obchodník s cennými papiermi","Emitent cenných papierov vo vzťahu k jeho informačným povinnostiam verejnoprávneho charakteru","Centrálny depozitár"],["Ktoré tvrdenie ohľadom je správne?","Finančný agent je oprávnený vykonávať finančné sprostredkovanie len pre finančnú inštitúciu, ktorá je oprávnená vykonávať činnosť na území Slovenskej republiky.","Finančný agent je oprávnený vykonávať finančné sprostredkovanie pre akúkoľvek finančnú inštitúciu so sídlom v EÚ alebo tretej krajine.","Finančný agent je oprávnený vykonávať finančné sprostredkovanie pre poskytovateľa služieb kryptoaktív.","Finančný agent je oprávnený vykonávať finančné sprostredkovanie pre poskytovateľa služieb hromadného financovania.","Finančný agent je oprávnený vykonávať finančné sprostredkovanie len pre finančné inštitúcie, ktorými sú banka a obchodník s cennými papiermi."],["Rozhodujúcim zákonom pre správcovské spoločnosti a fondy je","zákon o kolektívnom investovaní","zákon o správcovských spoločnostiach a podielových fondoch","zákon o bankách","zákon o dohľade nad finančným trhom","zákon o cenných papieroch"],["O udelení povolenia na vytváranie a spravovanie fondov rozhoduje","Národná banka Slovenska","Slovenská asociácia správcovských spoločností","Ministerstvo financií SR","Úrad pre finančný trh","Európska únia"],["Na predaj zahraničných fondov typu UCITS na Slovensku je potrebné","oznámenie príslušného orgánu dohľadu domovského členského štátu doru ická osoba so sídlom mimo územia SR","právnická osoba so sídlom mimo územia SR, ktorá má oprávnenie na obchodovanie s cennými papiermi udelené Národnou bankou Slovenska"],["V kolektívnom investovaní európsky štandardný fond je","fond vytvorený v inom členskom štáte, spĺňajúci podmienky smernice UCITS","fond, ktorým Európska únia financuje členské štáty","špeciálny fond zriadený vládou Slovenskej republiky","fond denominovaný v mene euro","fond, ktorý investuje do európskych akcií"],["Majetok vo fonde","je oddelený od majetku správcovskej spoločnosti","nie je oddelený od majetku správcovskej spoločnosti","môže byť použitý na vyrovnanie s veriteľmi správcovskej spoločnosti","môže byť použitý na vyrovnanie s veriteľmi správcovskej spoločnosti, ak tak určí súd","môže byť použitý na vyrovnanie s veriteľmi správcovskej spoločnosti, ak sa tak správcovská spoločnosť dohodne s podielnikmi"],["Ktorá možnosť je správna? Registrovaní správcovia","všetky uvedené odpovede sú správne","sú právnické osoby, ktoré sú oprávnené spravovať alternatívne investičné fondy alebo sú samosprávne investičné fondy na území Slovenskej republiky v prípade splnenia výnimky (§ 31a ods. 1 zákona o kolektívnom investovaní)","nemusia požiadať o povolenie podľa § 28a zákona o kolektívnom investovaní","musia byť zapísaní v Registri správcov vedenom Národnou bankou Slovenska, prostredníctvom vyplnenia registračného formulára","nie sú správcovské spoločnosti"],["Hlavnou službou centrálneho depozitára cenných papierov je:","prvotná evidencia cenných papierov v systéme zaknihovaných cenných papierov","investičné poradenstvo","umiestňovanie finančných nástrojov bez pevného záväzku","obchodovanie na vlastný účet","vykonávanie investičného prieskumu a finančnej analýzy"],["V podmienkach Slovenskej republiky prideľuje, mení a ruší ISIN","Centrálny depozitár cenných papierov","Ministerstvo financií Slovenskej republiky","Agentúra pre riadenie dlhu a likvidity","Národná banka Slovenska","Burza cenných papierov v Bratislave, a. s."],["Ktoré z nasledujúcich tvrdení o podobe cenného papiera je správne?","Cenný papier môže byť vydaný v listinnej podobe alebo v zaknihovanej podobe.","Cenný papier existuje výlučne v zaknihovanej podobe.","Cenný papier môže mať iba listinnú podobu, ak Národná banka Slovenska ako orgán dohľadu neurčí ina.k","Každý cenný papier musí mať listinnú a súčasne zaknihovanú podobu, aby bol platný.","Zákon rozlišuje len listinné cenné papiere, zaknihované nie sú prípustné."],["Vedľajšou službou nie je","riadenie portfólia finančných nástrojov","služby spojené s upisovaním finančných nástrojov","poskytovanie poradenstva v oblasti štruktúry kapitálu a stratégie podnikania","úschova a správa finančných nástrojov na účet klienta vrátane držiteľskej správy","vykonávanie obchodov s devízovými hodnotami, ak sú tie spojené s poskytovaním investičných služieb"],["Diverzifikácia je","rozloženie investície do rôznych druhov aktív, s cieľom znížiť (ekonomické) riziko spojené s vlastníctvom niektorého druhu aktív","spôsob rozdelenia zisku spoločnosti, kedy polovica je zadržaná a reinvestovaná, zostatok je vyplatený akcionárom v podobe dividendy","spôsob rozdelenia zisku spoločnosti, kedy dividendy sú prednostne vyplatené majiteľom prioritných akcií","ukazovateľ, ktorý vyjadruje, ako rýchlo je možné cenný papier premeniť na hotové peniaze","spôsob rozdelenia majetku na časť, ktorá bude vyplatená a časť, ktorá bude reinvestovaná"],["Beta koeficient akcie meria:","volatilitu (kolísavosť) ceny akcie v porovnaní s celkovým trhom","priemerný ročný dividendový výnos","podiel akcie na celkovom portfóliu klienta","vnútornú hodnotu akcie vypočítanú fundamentálnou analýzou","rozdiel medzi nominálnou a trhovou hodnotou akcie"],["Finančnými nástrojmi nie sú:","tokeny elektronických peňazí","nástroje peňažného trhu","cenné papiere a majetkové účasti vo fondoch kolektívneho investovania","prevoditeľné cenné papiere","finančné rozdielové zmluvy"],["Emisným kurzom cenného papiera je cena, za ktorú","emitent predáva cenný papier pri jeho vydaní","emitent kupuje cenný papier pri jeho splatnosti","investor predáva cenný papier pri jeho splatnosti","emitent kupuje cenný papier pri jeho vydaní","investor kupuje cenný papier na verejnom trhu"],["Čo vyjadruje výnosová krivka (yield curve) na dlhopisovom trhu?","závislosť medzi výnosom do splatnosti a dobou splatnosti dlhopisov","závislosť medzi cenou dlhopisu a jeho kupónom","rozdiel medzi výnosom z akcií a dlhopisov","historický vývoj cien dlhopisov na burze","priemerný výnos všetkých dlhopisov obchodovaných na trhu"],["Dividenda je príjmom z","akcie","štátneho dlhopisu","podnikového dlhopisu","podielového listu","vkladového účtu"],["Ak sa dosiahne investovaním vyšší výnos ako je inflácia","dochádza k reálnemu zhodnocovaniu finančných prostriedkov","dochádza k nominálnemu znehodnocovaniu finančných prostriedkov","dochádza k reálnemu znehodnocovaniu finančných prostriedkov","nedochádza k zhodnoteniu finančných prostriedkov","investovaním nie je možné dosiahnuť vyšší výnos ako je inflácia"],["Čo vyjadruje pojem durácia pri dlhopisoch?","priemerný vážený čas, za ktorý investor získa späť investovanú sumu prostredníctvom budúcich peňažných tokov z dlhopisu","čas do splatnosti dlhopisu uvedený v prospekte emisie","počet rokov, počas ktorých emitent vypláca kupónový výnos","minimálnu dobu držby dlhopisu, aby investor získal garantovaný výnos","rozdiel medzi výnosom do splatnosti a kupónovou sadzbou"],["Na kapitálovom trhu sa obchoduje spravidla","s kapitálovými a dlhovými cennými papiermi","s krátkodobými cennými papiermi so splatnosťou do 1 roka","s menami s lehotou použitia dlhšou ako 1 rok","iba s akciami","s podielovými listami s dobou splatnosti jeden rok"],["Ktoré tvrdenie je správne?","Finančný agent je povinný poskytovať klientovi vyhlásenie o vhodnosti vždy pri poskytovaní investičného poradenstva.","Finančný agent nie je povinný poskytovať klientovi vyhlásenie o vhodnosti len v prípade, ak je výsledkom poskytovaného investičného poradenstva odporúčanie predať finančný nástroj.","Finančný agent je povinný poskytovať klientovi vyhlásenie o vhodnosti len pri poskytovaní investičného poradenstva k akciovým ETF.","Finančný agent je povinný poskytovať klientovi vyhlásenie o vhodnosti len pri poskytovaní investičného poradenstva k podnikovým dlhopisom.","Finančný agent je povinný poskytovať klientovi vyhlásenie o vhodnosti pri poskytovaní investičného poradenstva, len ak sa poskytuje investičné poradenstvo na portfóliovom základe."],["Ktoré informácie musia byť súčasťou prospektu cenného papiera podľa nariadenia EÚ o prospekte?","Informácie o aktívach a pasívach, ziskoch a stratách, finančnej pozície a vyhliadok emitenta a akéhokoľvek ručiteľa; o právach spojených s cennými papiermi; o dôvodoch emisie a jej vplyvu na emitenta.","Informácie o predpokladanej trhovej cena cenného papiera o 5 rokov od jeho vydania.","Zoznam všetkých akcionárov emitenta a predpokladanú trhovú cenu cenného papiera o 5 rokov od jeho vydania.","Rating emitenta, aj keď emitent nie je ratingovaným subjektom; v takom prípade si emitent pridelí rating sám.","Len informácie o spôsobe distribúcie cenných papierov."],["Obchodník s cennými papiermi/finančný agent je povinný získať od klienta pri poskytovaní investičného poradenstva potrebné informácie týkajúce sa:","znalostí a skúseností klienta vzťahujúce sa na konkrétny typ finančného nástroja, informácie týkajúce sa finančnej situácie klienta vrátane jeho schopnosti znášať stratu, odolnosti klienta voči riziku a informácie o investičných cieľov klienta a či má preferencie v oblasti udržateľnosti","investičných cieľov klienta a informácie týkajúce sa finančnej situácie klienta vrátane jeho schopnosti znášať stratu","finančnej situácie klienta vrátane jeho schopnosti znášať stratu informácie týkajúce sa odolnosti klienta voči riziku a investičných cieľov klienta","znalostí a skúseností klienta vzťahujúce sa na konkrétny typ finančného nástroja a informácie týkajúce sa investičných cieľov klienta","znalostí a skúseností klienta vzťahujúce sa na konkrétny typ finančného nástroja a informácie týkajúce sa finančnej situácie klienta vrátane jeho schopnosti znášať stratu"],["Vyberte správne tvrdenie:","Finančný agent nie je oprávnený poskytovať klientom investičnú službu riadenie portfólia.","Finančný agent je oprávnený poskytovať klientom investičnú službu riadenie portfólia len vo vzťahu k akciovým ETF.","Podriadený finančný agent nie je oprávnený poskytovať klientom investičnú službu riadenie portfólia, túto investičnú službu je oprávnený poskytovať len samostatný finančný agent.","Finančný agent je oprávnený poskytovať klientom investičnú službu riadenie portfólia.","Finančný agent je oprávnený poskytovať klientom investičnú službu riadenie portfólia len v tom prípade, ak ju pre klientov neposkytuje obchodník s cennými papiermi, pre ktorého vykonáva finančné sprostredkovanie."],["Základnými prvkami plnenia požiadaviek na vytváranie finančných nástrojov a ich distribúciu (riadenie produktov, resp. \"Product Governance\") sú:","určenie cieľového trhu, distribučnej stratégie a dôkladné poznanie ponúkaných finančných nástrojov","určenie cieľového trhu, distribučnej stratégie a odmeňovania za predaj finančných nástrojov","určenie distribučnej stratégie a odmeňovania za predaj finančných nástrojov","určenie cieľového trhu a odmeňovania za predaj finančných nástrojov","dôkladné poznanie ponúkaných finančných nástrojov a určenie distribučnej stratégie"],["Skratka p.a. pri úročení znamená","ročne","od začiatku sporenia","mesačne","denne","podľa aktuálnosti"],["Rozloženie investícií v rámci fondu do viacerých aktív sa nazýva","diverzifikácia","durácia","devalvácia","diskriminácia","deskripcia"],["Trhová cena akcie je","cena, ktorá sa stanoví na akciovom trhu na základe ponuky a dopytu po akcii – kurz cenného papiera","priemerná cena, ktorá sa vypočítava z posledných trojmesačných aktuálnych kurzov akcie","cena, ktorú určuje NBS raz mesačne pre každý cenný papier","cena akcie pri jej vydaní","cena akcie určená odhadom"],["Na peňažnom trhu sa obchoduje spravidla","s krátkodobými cennými papiermi so splatnosťou do 1 roka","s cennými papiermi s dobou splatnosťou dlhšou ako 1 rok","s komoditami s dobou použitia kratšou ako 1 rok","so zlatom","s podielovými listami s dobou splatnosti dlhšou ako 1 rok"],["Portfólio fondu je","zložené z cenných papierov a iných aktív v majetku vo fonde","sumár poplatkov za nákup podielových listov a iných aktív","zložené z cenných papierov bez aktív peňažného trhu","zložené z cenných papierov v majetku vo fonde bez vkladov na bežných a vkladových účtoch","pomer medzi podielom akcií a dlhopisov v majetku vo fonde"],["Pojem Emerging Markets sa používa pre označenie","trhov rozvojových štátov, pričom ide najmä o akciové a dlhopisové trhy","vyspelé akciové trhy","akciových trhov v čase ekonomickej konjunktúry","rozvíjajúce sa akciové trhy, dlhopisové trhy sa však týmto pojmom neoznačujú","akciových trhov v čase ekonomickej recesie"],["Nezávislé hodnotenie dôveryhodnosti a schopnosti dlžníka splácať svoje budúce záväzky riadne a včas sa označuje ako","rating a takéto hodnotenie môže vypočítavať a zverejňovať len ratingová agentúra","rating a takéto hodnotenie môže vypočítavať a zverejňovať len obchodník s cennými papiermi","rating a takéto hodnotenie môže vypočítavať a zverejňovať len Európska centrálna banka","rating a takéto hodnotenie môže vypočítavať a zverejňovať len Národná banka Slovenska, pričom sa hodnotia subjekty, nad činnosťou ktorých vykonáva dohľad podľa zákona č. 747/2004 Z. z.","rating a takéto hodnotenie môže vypočítavať a zverejňovať len Európsky orgán pre cenné papiere a trhy (ESMA)"],["Takzvaný trojuholník investovania tvorí","výnos, riziko, likvidita","akcia, dlhopisy, komodity","druh majetku, región, mena","majetok, výnos, likvidita","akcia, riziko, výnos"],["Ukazovateľ, ktorý vyjadruje, ako rýchlo je možné cenný papier premeniť na hotové peniaze je","likvidita","volatilita","rating","diverzifikácia","výkonnosť fondu"],["Výšku dividendy schvaľuje","valné zhromaždenie","predstavenstvo","štatutárny orgán","Národná banka Slovenska","audítor"],["Čo vyjadruje „výnos do splatnosti“ (yield to maturity – YTM) pri dlhopise?","Celkový priemerný ročný výnos, ktorý investor získa, ak dlhopis drží do splatnosti a reinvestuje všetky kupóny za rovnakú sadzbu.","Ročný kupón vyjadrený v percentách z nominálnej hodnoty.","Rozdiel medzi nákupnou a predajnou cenou dlhopisu.","Priemerný ročný rast ceny dlhopisu na sekundárnom trhu.","Úrokovú sadzbu vypočítavanú a zverejňovanú Európskou centrálnou bankou."],["Vyberte správne tvrdenie:","Finančný agent je povinný viesť záznamy komunikácie s klientom, ktorá prebehla prostredníctvom diaľkovej komunikácie, počas 5 rokov a na žiadosť NBS 7 rokov.","Finančný agent je povinný viesť záznamy komunikácie s klientom, ktorá prebehla prostredníctvom diaľkovej komunikácie, počas 2 rokov a na žiadosť NBS 3 roky.","Finančný agent nie je povinný viesť záznamy komunikácie s klientom, ktorá prebehla prostredníctvom diaľkovej komunikácie.","Finančný agent je povinný viesť len záznamy komunikácie s klientom, ktorá sa uskutočnila na osobnom stretnutí, počas 2 rokov a na žiadosť NBS 3 roky.","Finančný agent je povinný viesť záznamy komunikácie s klientom, len ako ho o to klient požiada."],["V období ekonomického rastu najrýchlejšie rastú ceny","cyklických akcií","prioritných akcií","defenzívnych akcií","zamestnaneckých akcií","tzv. zlatých akcií"],["Ktoré vyhlásenie najlepšie vystihuje riziko koncentrácie pri investovaní?","Vysoké riziko koncentrácie znamená, že značná časť investičného portfólia je sústredená do jedného aktíva, úzkej skupiny aktív alebo aktív - finančných nástrojov vydaných jedným emitentom.","Nízke riziko koncentrácie znamená, že značná časť investičného portfólia je sústredená do jedného aktíva, úzkej skupiny aktív alebo aktív - finančných nástrojov vydaných jedným emitentom.","Nízke riziko koncentrácie znamená, že investor investuje výlučne do štátnych dlhopisov jedného emitenta.","Vysoké riziko koncentrácie je v prípade, ak investor pravidelne investuje do viacerých ETF, ktoré sa líšia zameraním a sú poskytované viacerými správcami.","Riziko koncentrácie je z hľadiska neprofesionálneho klienta - bežného investora – nepodstatné."],["Likvidita je","schopnosť premeny finančného nástroja na hotovosť s minimálnymi finančnými a časovými nákladmi","schopnosť dosiahnuť zisk pred zdanením","doba premeny listinného cenného papiera na zaknihovaný cenný papier","doba likvidácie cenného papiera","schopnosť čo najdlhšie udržať stabilný kurz cenného papiera"],["Z nižšie uvedených aktív je obvykle najmenej likvidným aktívom","nehnuteľnosť","akcia spoločnosti obchodovateľná na burze","prostriedky na bežnom účte","pokladničná poukážka","podielový list"],["Ktoré z nasledujúcich tvrdení o likvidite je správne?","Cenné papiere prijaté na obchodovanie na regulovanom trhu majú zvyčajne vyššiu likviditu než tie, ktoré nie sú prijaté na obchodovanie na regulovanom trhu.","Likvidita akcie prijatej na obchodovanie na regulovanom trhu je výlučne určená jej cenou.","Likvidita akcie prijatej na obchodovanie na regulovanom trhu sa v priebehu času nemení.","Podnikové dlhopisy, ktoré nie sú prijaté na obchodovanie na regulovanom trhu sú spravidla vysoko likvidné.","Investície do akcií s vysokou likviditou majú garantovaný výnos."],["Volatilita finančného nástroja je","označenie pre kolísanie kurzov finančného nástroja prijatého na obchodovanie na regulovanom trhu v priebehu konkrétneho času","vlastnosť finančného nástroja, ktorá je pre neprofesionálneho klienta nepodstatná","ukazovateľ vyjadrujúci citlivosť dlhopisu na zmenu úrokových sadzieb","označenie pre rozloženie investície do rôznych finančných nástrojov","spôsob rozdelenia zisku spoločnosti, ktorej akcie sú prijaté na obchodovanie na regulovanom trhu"],["Investícia do otvoreného podielového fondu","nie je chránená Fondom na ochranu vkladov","je chránená Fondom na ochranu vkladov bez obmedzenia","je chránená Fondom na ochranu vkladov len do výšky 90% aktuálnej hodnoty podielového listu","je chránená Fondom na ochranu vkladov iba v prípade poklesu aktuálnej hodnoty podielového listu na nulovú hodnotu","je chránená Fondom na ochranu vkladov iba do výšky 50% aktuálnej hodnoty podielového listu"],["Finančný agent je oprávnený na poskytovanie investičnej služby prijatie a postúpenie pokynu klienta týkajúcich sa len:","prevoditeľných cenných papierov a cenných papierov a majetkových účastí vo fondoch kolektívneho investovania","prevoditeľných cenných papierov a kryptoaktív regulovaných podľa nariadenia MiCA","prevoditeľných cenných papierov a cenných papierov, majetkových účastí vo fondoch kolektívneho investovania a finančných rozdielových zmlúv (CFD)","majetkových účastí vo fondoch kolektívneho investovania a finančných rozdielových zmlúv (CFD)","prevoditeľných cenných papierov a a kryptoaktív regulovaných podľa nariadenia MiCA"],["Zaistené fondy","zaisťujú investorovi splatenie celého alebo časti vloženého kapitálu","zaisťujú investorovi vyplatenie podielových listov, ktoré by inak nemuseli byť vyplatené","patria medzi najčastejšie predávané fondy","zaisťujú investorom dosiahnutie najvyšších výnosov na trhu","sú úplne bezrizikové"],["Ktoré z uvedených typov fondov nie je možné ponúkať neprofesionálnym investorom, ktorí zároveň nie sú kvalifikovanými investormi?","tuzemské subjekty kolektívneho investovania s právnou subjektivitou v správe registrovaného správcu a špeciálne fondy kvalifikovaných investorov","verejné špeciálne fondy nehnuteľností a verejné špeciálne fondy alternatívnych investícií","verejné špeciálne fondy nehnuteľností a verejné špeciálne fondy cenných papierov","štandardné fondy a verejné špeciálne fondy cenných papierov","štandardné fondy a európske štandardné fondy"],["Ktoré vyhlásenie o riadení produktov (Product Governance\") je správne?","Samostatný finančný agent musí rozumieť finančným produktom, ktoré ponúka, určuje k nim cieľový trh (pozitívny cieľový trh) a distribučnú stratégiu - investičné služby, prostredníctvom ktorých sa bude finančný nástroj predávať.","Samostatný finančný agent musí rozumieť finančným produktom, ktoré ponúka, avšak neurčuje k nim cieľový trh (pozitívny cieľový trh), preberá ho od bez vlastného posúdenia od finančnej inštitúcie, určuje len distribučnú stratégiu.","Samostatný finančný agent nemusí úplne rozumieť finančným produktom, ktoré ponúka, postačujúce je len, ak im rozumie finančná inštitúcia, pre ktorú vykonáva finančné sprostredkovanie.","Samostatný finančný agent musí rozumieť finančným produktom, ktoré ponúka, určuje k nim cieľový trh (pozitívny cieľový trh), no neurčuje distribučnú stratégiu - investičné služby, prostredníctvom ktorých bude finančný nástroj predávať.","Samostatný finančný agent musí rozumieť finančným produktom, ktoré ponúka, a určuje len negatívny cieľový trh."],["Pre konzervatívneho klienta je najdôležitejšia","nízke riziko investície","likvidita","mierne riziko","nemá priority","dlhodobý investičný horizont"],["Klientovi, ktorý nevie znášať vyššie riziko, by ste odporučili investičnú stratégiu","konzervatívnu","akciovú","dynamickú","zmiešanú","špekulatívnu"],["Ktorého investora môžeme považovať za kvalifikovaného investora?","Neprofesionálneho alebo profesionálneho investora, ktorý investuje určitú minimálnu výšku, pričom v závislosti od toho, do akého subjektu kolektívneho investovania investuje, sa táto minimálna suma môže líšiť (napr. ak investuje do špeciálneho fondu kvalifikovaných investorov alebo do tuzemského subjektu kolektívneho investovania s právnou subjektivitou, pôjde o najmenej 50 000 EUR; ak investuje do  EuVECA alebo EuSEF, pôjde o najmenej 100 000 EUR).","Neprofesionálneho investora, ktorý investuje určitú minimálnu výšku, pričom v závislosti od toho, do akého subjektu kolektívneho investovania investuje, sa táto minimálna suma môže líš í SR, ak ide o zahraničnú banku so sídlom v EHP a má povolenie na činnosť od orgánu dohľadu v štáte, v ktorom má táto inštitúcia sídlo a o tomto povolení je informovaná NBS","akákoľvek, ak má zahraničná banka v SR registrované svoje zastúpenie"],["Môže banka vykonávať činnosť finančného lízingu?","Áno, ak to má uvedené vo svojom bankovom povolení.","Môže.","Môže, ak má na to dostatok zamestnancov.","Môže, ak disponuje takým majetkom, ktorý sa môže stať predmetom finančného lízingu.","Nemôže."],["Môže mať banka priamu kontrolu nad priemyselným podnikom?","Nie.","Môže.","Môže, ak mu poskytuje úvery na financovanie výroby.","Môže, ak nadpolovičná väčšina zástupcov štatutárnych orgánov banky a priemyselného podniku sú tie isté osoby.","Môže, ak nad bankou a priemyselným podnikom vykonáva priamu kontrolu tá istá osoba."],["Akým predpisom, právnym aktom alebo rozhodnutím je ustanovené bankové tajomstvo?","Zákonom o bankách.","Zákonom o bankách v spojení s Obchodným zákonníkom.","Zákonom o bankách v spojení s Občianskym zákonníkom.","Rozhodnutím Národnej banky Slovenska.","Rozhodnutím Najvyššieho súdu."],["Čo má obsahovať základný bankový produkt?","Bankové služby v rozsahu určenom zákonom o bankách a vykonávacím predpisom podľa zákona o bankách.","Vedenie bežného účtu a vydanie platobnej karty.","Vedenie bežného a vkladového účtu.","Bankové služby v rozsahu určenom klientom banky.","Bankové služby v rozsahu neprekračujúcom výšku poplatku ustanoveného vykonávacím predpisom podľa zákona o bankách."],["Ministerstvo výstavby a regionálneho rozvoja poskytuje finančné prostriedky na štátnu prémiu v rámci stavebného sporenia","ročne za predchádzajúci rok","polročne za predchádzajúci polrok","štvrťročne za predchádzajúci štvrťrok","finančné prostriedky na štátnu prémiu poskytuje Ministerstvo financií Slovenskej republiky","finančné prostriedky na štátnu prémiu poskytuje vláda Slovenskej republiky podľa schváleného rozpočtu"],["Frekvencia generovania výpisov z účtu sa:","mení pre Výber termínovaného vkladu môže byť obmedzený: dohodnutým termínom splatnosti alebo dohodnutou výpovednou lehotou","peniaze uložené spravidla súkromnými osobami v banke na dlhšiu dobu. Od termínovaných vkladov sa neodlišujú","od termínovaných vkladov sa odlišujú najmä tým, že termín výberu je vopred stanovený"],["Aké vklady (mimo iných) nechráni Fond ochrany vkladov v SR?","Vklady bánk, obchodníkov s cennými papiermi.","Vklady fyzických osôb.","Vklady nadácií, neinvestičných fondov.","Vklady neziskových organizácií poskytujúcich všeobecne prospešné služby.","Vklady spoločenstiev vlastníkov bytov."],["Správu o záležitostiach týkajúcich sa klienta, ktoré sú predmetom bankového tajomstva, podá banka, resp. pobočka zahraničnej banky bez súhlasu klienta a na písomné vyžiadanie výhradne","daňovému úradu alebo colnému úradu vo veciach daňového, resp. colného konania, ktorého účastníkom je klient","banke alebo pobočke zahraničnej banky v štáte, kde pôsobí","správe finančnej kontroly pri výkone finančnej kontroly u klienta banky alebo pobočky zahraničnej banky","Sociálnej poisťovni","vláde Slovenskej republiky"],["Vyhlásenie o vlastníctve peňažných prostriedkov","môže byť súčasťou zmluvy o bežnom účte, v tomto prípade sa nevyžaduje od klienta - majiteľa účtu pri každom vklade nad požadovanú sumu osobitné vyhlásenie","nemôže byť súčasťou zmluvy o bežnom účte, klient - majiteľ účtu musí vždy pri vklade nad požadovanú sumu podpísať vyhlásenie","môže byť súčasťou zmluvy o termínovanom účte, len ak je účet vedený v mene EUR alebo USD, vtedy sa osobitné vyhlásenie nevyžaduje","nemusia podpisovať štátny príslušníci Slovenskej republiky v pobočke banky so sídlom na území Slovenskej republiky","nemusí byť súčasťou zmluvy o bežnom účte, ak klient uzatvára túto zmluvu za prítomnosti notára"],["Úroková báza vyjadruje","počet dní v roku pre výpočet úrokov","počet dní v mesiaci pre výpočet úrokov","počet dní v štvrťroku pre výpočet úrokov","počet mesiacov v roku pre výpočet úrokov","počet dní v týždni pre výpočet poplatkov"],["Čo je to platobná inštitúcia?","Právnická osoba so sídlom v SR oprávnená poskytovať platobné služby na základe povolenia na poskytovanie platobných služieb.","Banka, ktorá vykonáva platobný styk.","Banka, ktorá vedie svojim klientom platobné účty.","Osoba, ktorá môže poukazovať peniaze.","Osoba, ktorá môže poukazovať peniaze, okrem Pošty."],["Čo sú to elektronické peniaze?","Peňažná hodnota uchovávaná elektronicky, vrátane magnetického záznamu, ktoré predstavujú peňažný záväzok vydavateľa elektronických peňazí vzniknutý pri prijatí finančných prostriedkov na účely vykonávania platobných operácií a ktoré sú na základe zmluvy prijímané aj u inej osoby ako u vydavateľa elektronických peňazí","Peňažná hodnota v elektronickej forme, ktorá predstavuje nevyčerpanú hodnotu uloženú na akomkoľvek elektronickom zariadení (napríklad čipe) na nákup akýchkoľvek tovarov a služieb.","Zostatok na bežnom účte vedenom v banke.","Zostatok na účte zaknihovaných cenných papierov vedenom v centrálnom depozitári.","Opak obeživa."],["Aký výzor má virtuálna platobná karta? Je možné virtuálne platobné karty použiť aj na výber z bankomatu?","Virtuálna platobná karta má nehmotnú podobu, držiteľ dostáva identifikátory formou bezpečnostnej obálky – používa sa len pri platbách cez internet.","Je to len brožúra s postupom pri platbách cez internet, klient k nej musí mať vždy vydanú debetnú alebo kreditnú embosovanú platobnú kartu.","Je to klasický plast, ibaže neobsahuje meno držiteľa – je prenosná a použiteľná na akýkoľvek účel.","Platobná karta, ktorá neexistuje v hmatateľnej podobe, držiteľ dostáva identifikátory výlučnej prostredníctvom SMS, používa sa len v prípade straty klasickej platobnej karty, do doby vystavenia novej.","Virtuálna platobná karta neexistuje."],["Banky, ktoré participujú vo Fonde ochrany vkladov, hradia tieto poplatky","vstupný, ročný a mimoriadny","mesačný a náhradný","polročný a výplatný","vstupný a mimoriadny","ročný"],["Medzi pasívne operácie bánk patrí","príjem vkladov","poskytovanie úverov","investovanie do akcií","vydávanie krytých dlhopisov","zmenárenská činnosť"],["Kryté dlhopisy môžu vydávať","len banky, ktoré majú predchádzajúci súhlas na na vykonávanie činností súvisiacich s programom krytých dlhopisov","ktorékoľvek banky","len stavebné sporiteľne","banky a poisťovne ak umiestňujú prostriedky technických rezerv do hypotekárnych záložných listov","správcovské spoločnosti"],["IBAN je","medzinárodný formát čísla bankového účtu","medzinárodné medzibankové autorizačné číslo","medzinárodné číslo jednotného bankového účtu používané pri platbách EUR realizovaných do/ z USA","jeden z mnohých ochranných prvkov k platobnej karte","prístupový kód k úverovému účtu"],["Suma úrokov sa vypočíta podľa vzorca","zostatok * úroková sadzba * počet dní / úroková báza","zostatok * úroková sadzba * počet dní / 100","zostatok * úroková sadzba * počet dní / (100 * úroková báza)","(vklad * úrok) – poplatky","(vklad * úrok) / úroková báza"],["Kto môže spracovávať bankovky, mince, pamätné bankovky a pamätné mince?","Banka, ak to má uvedené vo svojom bankovom povolení a Národná banka Slovenska.","Banka a Národná banka Slovenska.","Banka, ak to má uvedené vo svojom bankovom povolení.","Národná banka Slovenska.","Banka."],["Musí banka disponovať vlastnou sieťou bankomatov?","Nemusí.","Nemusí, ak je dohodnutá s inou bankou na využívaní siete bankomatov tej inej banky.","Nemusí, ak je dohodnutá s Národnou bankou Slovenska o využívaní bankomatov Národnej banky Slovenska.","Musí.","Musí, ak vydáva bankové platobné karty svojim klientom."],["Hybridná platobná karta je platobná karta","obsahujúca magnetický prúžok aj čip, ak obchodník používa POS terminál s čipovou technológiou, platobná karta bude autorizovaná prostredníctvom čipu a držiteľ potvrdzuje transakciu PIN kódom","ktorá neexistuje","obsahujúca len čip a držiteľ vždy potvrdzuje transakciu PIN kódom","je platobná karta, ktorú možno používať v hotovostnom aj bezhotovostnom platobnom styku","ktorú vystavujú na území Slovenskej republiky len pobočky zahraničných bánk"],["Dohľad nad dodržiavaním podmienok poskytovania štátnej prémie v stavebnom sporení vykonáva","Ministerstvo financií SR","Národná banka Slovenska","Stavebná sporiteľňa","Slovenská banková asociácia","Register bankových úverov a záruk"],["Banky na Slovensku odvodzujú svoje úrokové sadzby na vkladových účtoch od úrokových sadzieb, ktoré vyhlasuje:","ECB","NBS","FED","NR SR","Vláda SR"],["Na zistenie klienta, či je tzv. rizikovým klientom a/alebo sankcionovanou osobu","koná sa v súlade s postupmi danej finančnej inštitúcie, kde sú uvedené „Zásady a postupy prevencie pred legalizáciou príjmov z trestnej činnosti a o ochrane pred financovaním terorizmu“","neuplatní sa zásada „KYC“ (Know your customer / poznaj svojho klienta)","poskytne sa služba ako každému inému klientovi","uplatní sa zásada „KYC“ (Know your customer / poznaj svojho klienta)“","zásady „KYC“ (Know your customer / poznaj svojho klienta) sa vzťahujú len na klientov, ktorí majú trvalý pobyt v zahraničí"],["AML (legalizácia príjmov z trestnej činnosti a financovania terorizmu) riziko je:","riziko, že povinná osoba môže byť zneužitá na pranie špinavých peňazí alebo na financovanie terorizmu","riziko úverového podvodu voči banke","riziko straty klienta z dôvodu konkurenčnej nevýhody","riziko podvodu voči sprostredkovateľovi","riziko straty zisku"],["Politicky exponovanou osobou je z hľadiska zákona č. 297/2008:","fyzická osoba, ktorá je vo významnej verejnej funkcii a nemá po dobu jej výkonu a po dobu jedného roka od skončenia výkonu významnej verejnej funkcie trvalý pobyt na území Slovenskej republiky","fyzická osoba, ktorá je vo významnej verejnej funkcii a má po dobu jej výkonu a po dobu jedného roka od skončenia výkonu významnej verejnej funkcie trvalý pobyt na území Slovenskej republiky","každý politik vo významnej verejnej funkcii bez ohľadu na jeho trvalý pobyt","fyzická osoba, ktorá nie je vo významnej verejnej funkcii a nemá trvalý pobyt na území Slovenskej republiky","fyzická osoba, ktorá nie je vo významnej verejnej funkcii a má trvalý pobyt na území Slovenskej republiky"],["Konečný užívateľ výhod je z hľadiska zákona č. 297/2008:","vždy fyzická osoba (fyzické osoby), v prospech ktorej sa obchod vykonáva","právnická osoba, v prospech ktorej sa obchod vykonáva","klient, ktorý podpisuje príslušnú dokumentáciu k obchodu","finančný sprostredkovateľ, ktorý podpisuje príslušnú dokumentáciu k obchodu","vždy fyzická osoba, v prospech ktorej sa obchod nevykonáva"],["Zisťovať konečného užívateľa výhod je povinná osoba z hľadiska zákona č. 297/2008 povinná ak:","je klient fyzická osoba; ak je právnická osoba alebo združenie majetku až po úroveň fyzickej osoby","je klient právnická osoba alebo združenie majetku","vždy","je klient občanom SR","nikdy"],["Povinná osoba je povinná hodnotiť alebo prehodnotiť AML (legalizácia príjmov z trestnej činnosti a financovania terorizmu) riziko:","pri zakladaní obchodného vzťahu, pri príležitostnom obchode mimo obchodného vzťahu, ktorého hodnota presiahne 15 000 eur, ak je podozrenie, že klient pripravuje alebo vykonáva neobvyklú obchodnú operáciu alebo pri pochybnostiach o pravdivosti a úplnosti predtým získaných údajov o klientovi","pri príležitostnom obchode, ktorého hodnota presiahne 200 000 eur a pri klientoch","iba pri príležitostnom obchode, ktorého hodnota presiahne 20 000 eur a pri klientoch","iba pri vzniku podozrenia na vykonávanie neobvyklej obchodnej operácie","iba pri pravidelnom obchode, ktorého hodnota presiahne 20 000 eur"],["Banka je povinná ohlásiť neobvyklú obchodnú operáciu:","bez zbytočného odkladu","neodkladne","najneskôr v deň, keď bola neobvyklá obchodná operácia vykonaná","bez zbytočného odkladu, najneskôr však do 30 dní","najskôr v deň, keď bola neobvyklá obchodná operácia vykonaná"],["Kto je konečný užívateľ výhod?","Fyzická osoba, ktorá má priamy alebo nepriamy podiel alebo súčet takýchto podielov je najmenej 25% na základnom imaní alebo na hlasovacích právach v klientovi, ktorým je právnická osoba - podnikateľ, vrátane akcií na doručiteľa, ak nie je táto právnická osoba emitentom cenných papierov prijatých na obchodovanie na regulovanom trhu, ktorý podlieha požiadavkám na uverejňovanie informácií podľa osobitného predpisu, t.j. zákon č. 566/2001 Z.z..","Fyzická osoba, ktorá má právo vymenovať, inak ustanoviť alebo odvolať štatutárny orgán, väčšinu členov štatutárneho orgánu, väčšinu členov dozornej rady alebo iný riadiaci orgán, dozorný orgán alebo kontrolný orgán klienta, ktorým je právnická osoba - podnikateľ.","Právnická osoba.","Fiktívny vlastník, definovaný v Smernici 2005/60/ES.","Neskutočný vlastník, definovaný v Smernici 2005/60/ES."],["Ktoré operácie sú z hľadiska prania špinavých peňazí a financovania terorizmu najrizikovejšie?","Hotovostné.","Bezhotovostné.","Operácie s finančnými nástrojmi.","Úverové.","Platobnými kartami."],["Aké číslo účtu umožňuje jednoznačnú identifikáciu klienta a automatizované spracovanie platby?","Takéto spracovanie platby umožňuje číslo účtu v tvare BBAN alebo IBAN.","Pre jednoznačnú identifikáciu klienta je potrebný SWIFT kód.","Automatizované spracovanie je zabezpečené len v tom prípade ak je na prevodnom príkaze uvedený len BIC.","Takéto spracovanie platby umožňuje číslo účtu v štandardnom tvare, ktoré sa používa pri domácich platbách.","Pre jednoznačnú identifikáciu je potrebné uviesť rodné číslo klienta."],["Ako nazývame medzinárodný identifikačný kód slúžiaci na identifikáciu finančnej inštitúcie?","Medzinárodný identifikačný kód, ktorý má 8 až 11 znakov sa nazýva BIC alebo SWIFT kód.","Medzinárodný identifikačný kód je číslo účtu v tvare IBAN.","Medzinárodný identifikačný kód sa pri medzinárodnom platobnom styku nepoužíva.","Medzinárodný identifikačný kód je číslo účtu v štandardnom tvare.","Medzinárodný kód je SEPA."],["Regulovaná hladká platba do zahraničia je:","platba v EUR, v sume max. 50 000 eur, do krajín EHP, s dispozíciou na poplatky SHA, účet príjemcu je v tvare IBAN, s uvedeným správnym SWIFT/BIC banky príjemcu","platba v EUR, do krajín EHP, s dispozíciou na poplatky SHA, účet príjemcu v tvare IBAN, s uvedeným správnym SWIFT/BIC banky príjemcu","platba v EUR, do krajín EHP, s dispozíciou na poplatky OUR, účet príjemcu v tvare IBAN","platba v EUR, do krajín EHP, s dispozíciou na poplatky OUR, účet príjemcu v tvare IBAN, s uvedeným správnym SWIFT/BIC banky príjemcu","platba v EUR, v sume max. 12 500 eur, do krajín EHP, s dispozíciou na poplatky SHA, účet príjemcu v tvare IBAN, s uvedeným správnym SWIFT/BIC banky"],["Dispozícia (inštrukcia) na poplatky SHA (share) pri platbe do zahraničia znamená:","poplatky banky platiteľa hradí platiteľ, poplatky banky príjemcu a sprostredkujúcich bánk hradí príjemca","poplatky bánk si platiteľ s príjemcom rozdelia rovnakým dielom, t.j. poplatky banky platiteľa hradí platiteľ, poplatky banky príjemcu hradí príjemca","všetky poplatky spojené s hladkou bankou hradí platiteľ","všetky poplatky spojené s hladkou platbou hradí príjemca","hladká platba bude zúčtovaná bez poplatku na základe zmluvy s bankou"],["Nostro účet banky je:","účet banky obvykle vedený v cudzej mene v inej banke v zahraničí, ktorá sa zvykne označovať aj ako korešpondenčná banka","účet banky v tuzemskej banke, prostredníctvom ktorého banka vykonáva cezhraničné prevody v cudzej mene","účet zahraničnej banky v tuzemskej banke, vedený v cudzej mene, prostredníctvom ktorého zahraničná banka vykonáva cezhraničné prevody v mene EUR","účet banky v korešpondenčnej banke výlučne v mene EUR, prostredníctvom ktorého banka vykonáva cezhraničné prevody v mene EUR účet tuzemskej banky v zahraničnej banke výlučne v cudzej mene","účet TOP manažéra banky v zahraničí"],["Zadanie sumy limitu inkasa:","nie je povinné pri zriaďovaní a zmene povolenia na inkaso","je povinné len pri zriaďovaní a nie je povinné pri zmene povolenia na inkaso","je povinné pri zriaďovaní a zmene povolenia na inkaso","nie je povinné pri zriaďovaní a je povinné pri zmene povolenia na inkaso","nie je možné"],["K povinným náležitostiam Europlatby patrí","typ poplatku „SHA“","skrátený názov účtu a úplná adresa platiteľa","suma platby nižšia alebo rovná 50 000 USD","typ poplatku OUR","suma platby nižšia alebo rovná 50 000 EUR"],["Povinnou náležitosťou Europlatby nie je:","celý názov a úplná adresa banky príjemcu","swiftový kód banky príjemcu „BIC“ a číslo účtu príjemcu v tvare „BAN“","účet platiteľa aj účet príjemcu vedený v banke so sídlom v rámci Európskeho hospodárskeho priestoru (EHP)","číslo účtu príjemcu v tvare „IBAN“","suma platby nižšia alebo rovná 50 000 eur"],["BIC (Bank Identifier Code, swiftový kód):","je medzinárodným jedinečným identifikačným kódom banky a v niektorých prípadoch až pobočky banky","slúži na jednoznačnú identifikáciu účtu platiteľa pri vykonávaní tuzemských platobných operácií","slúži na jednoznačnú identifikáciu účtu platiteľa pri vykonávaní cezhraničných platobných operácií","je kódom prideleným bankou platiteľa pre jednoznačnú identifikáciu platiteľa, pri vykonávaní tuzemských platobných operácií","je kódom prideleným NBS na jednoznačnú identifikáciu banky pri vykonávaní tuzemských platobných operácií"],["IBAN (International Bank Account Number):","je medzinárodný formát bankového čísla účtu","slúži na jednoznačnú identifikáciu banky pri vykonávaní cezhraničných platobných operácií","sú poplatky bánk, ktoré znáša platiteľ a sú zúčtované ihneď po platbe","sú poplatky bánk, ktoré znáša príjemca, ktorému je pripísaná suma platby znížená o poplatky bánk","slúži na jednoznačnú identifikáciu banky pri vykonávaní tuzemských platobných operácií"],["Medzi krajiny EHP nepatrí:","Ukrajina","Rakúsko","Česká republika","Maďarsko","Poľsko"],["Zákon 492/2009 o platobných službách a o zmene a doplnení niektorých zákonov sa nevzťahuje na:","platobné operácie v inej mene ako euro, vykonávané výlučne finančnými prostriedkami v hotovosti priamo medzi platiteľom a príjemcom bez akéhokoľvek sprostredkovania","poskytovanie platobných služieb","podmienky na vznik a prevádzkovanie platobných systémov","podmienky na vznik a podnikanie platobných inštitúcií","podmienky na vznik a podnikanie inštitúcií elektronických peňazí"]]},{"id":"Uv","name":"Poskytovanie úverov","sub":"sektor Úv","q":[["Úver je","dočasné poskytnutie peňažných prostriedkov veriteľa v prospech dlžníka s podmienkou, že dlžník sa zaväzuje poskytnuté prostriedky vrátiť v zmysle dohodnutých zmluvných podmienok vrátane úrokov","nenávratná pôžička, keď veriteľ poskytne dlžníkovi peňažné prostriedky bezodplatne","pomoc štátu pre podnikateľov, ktorí preukázali platobnú neschopnosť","dočasné poskytnutie peňažných prostriedkov dlžníka v prospech veriteľa s podmienkou, že veriteľ sa zaväzuje poskytnuté prostriedky vrátiť v zmysle dohodnutých zmluvných podmienok","pomoc štátu pre mladých ľudí pracujúcich za minimálnu mzdu"],["Úverová zmluva je","písomná dohoda, ktorou sa veriteľ zaväzuje poskytnúť dlžníkovi peňažné prostriedky a dlžník sa zaväzuje ich vrátiť a uhradiť celkové náklady spojené s úverom v zmysle dohodnutých zmluvných podmienok vrátane úrokov","informáciou pre spotrebiteľa o výške schváleného úveru bankou alebo poisťovňou za podmienky, že peňažné prostriedky vráti a uhradí celkové náklady spojené s úverom v zmysle dohodnutých zmluvných podmienok","doklad pre veriteľa o výške požičaných prostriedkov od dlžníka","doklad o hodnote nehnuteľnosti, ktorý vypracuje banka pre klienta","splátkový kalendár"],["Dlžník ako zmluvná strana v úverovej zmluve je","osoba povinná na základe dohodnutých zmluvných podmienok splatiť dlžnú sumu vrátane úrokov a poplatkov poskytovateľovi úveru, s ktorým uzavrela zmluvný vzťah","poskytovateľ úveru, ktorému je klient povinný splatiť dlžnú sumu úveru, vrátane úrokov a poplatkov, v zmysle dohodnutých zmluvných podmienok","osoba, ktorá znižuje bonitu klienta svojim príjmom, výsledkom čoho je výsledný disponibilný príjem pre získanie úveru","osoba, ktorá stratila nárok na štátny príspevok/daňový bonus","je fyzická osoba, ktorá má po poskytnutí úveru pohľadávku"],["Spoludlžník pri úverovej zmluve je","osoba povinná na základe dohodnutých zmluvných podmienok splatiť dlžnú sumu vrátane úrokov a poplatkov poskytovateľovi úveru, s ktorým uzavrela zmluvný vzťah, v rovnakom rozsahu ako dlžník","poskytovateľ úveru, ktorému je klient povinný splatiť dlžnú sumu úveru, vrátane úrokov a poplatkov, v zmysle dohodnutých zmluvných podmienok","osoba, ktorá znižuje bonitu klienta svojim príjmom, výsledkom čoho je výsledný disponibilný príjem pre získanie úveru","osoba, ktorá je povinná splatiť dlžnú sumu vrátane úrokov a poplatkov, ak si túto povinnosť voči poskytovateľovi úveru nesplní dlžník","osoba, ktorá má povinnosť splatiť dlh namiesto dlžníka, ak ten neplní riadne a včas"],["Ručiteľ pri úverovej zmluve je","osoba, ktorá vystupuje v úverovom vzťahu a zmluvne na seba zobrala povinnosť splniť dlh, ak ho neplní dlžník","osoba povinná na základe dohodnutých zmluvných podmienok splatiť dlžnú sumu vrátane úrokov a poplatkov dlžníkovi","osoba povinná na základe dohodnutých zmluvných podmienok splatiť dlžnú sumu vrátane úrokov a poplatkov veriteľovi, s ktorým uzavrela zmluvný vzťah, pričom si splatený záväzok nemôže vymáhať od dlžníka","osoba povinná na základe dohodnutých zmluvných podmienok splatiť úroky","osoba povinná na základe dohodnutých zmluvných podmienok splatiť istinu"],["Ručitelia, ak ich je viac, ručia za záväzok","každý v plnej výške, ak sa nedohodli odlišne od zákonného ustanovenia","pomerne","každý do výšky svojho príjmu","v poradí podľa výšky základného imania pri právnických osobách","podľa poradia v akom pristupovali k ručeniu, ak ručenie nenastalo naraz"],["Je ručiteľ oprávnený uplatniť si nárok voči dlžníkovi, ak splatil úver za dlžníka, resp. spoludlžníka?","môže od neho vymáhať celú sumu, ktorú zaplatil pôvodnému veriteľovi dlžníka","môže od neho vymáhať iba časť sumy, ktorá pripadá na jeho podiel","m hľadávok s cieľom postupného prevzatia celej spoločnosti"],["Automatická výmena pri platobných kartách je proces","kedy je po uplynutí platnosti karty automaticky, bez podania žiadosti, vystavená nová karta s rovnakými parametrami ako predchádzajúca karta","výmeny platobnej karty v prípade, ak klient pôvodnú kartu zablokoval z dôvodu straty alebo krádeže","výmeny platobnej karty v prípade, ak klient fyzicky poškodil pôvodnú kartu","kedy sa aktualizujú údaje na platobnej karte","kedy má klient možnosť vymeniť banku"],["Klient môže vybrať z bankomatu virtuálnou kreditnou kartou maximálne","výber z bankomatu takouto kartou nie je možný","do výšky schváleného hotovostného limitu","500 eur týždenne","do výšky zostatku na bežnom účte","500 eur mesačne"],["Forfaiting môžeme charakterizovať ako","odkupovanie strednodobých a dlhodobých pohľadávok bankou","odkupovanie krátkodobých pohľadávok bankou","poskytovanie úverov na základe osobného ručenia","predaj krátkodobých úverov bankou","odkupovanie krátkodobých záväzkov bankou"],["Medzi úverové produkty nepatrí","depozitný certifikát","hypotéka","americká hypotéka","stavebný úver","spotrebný úver"],["Klient získa bezúročné obdobie na kreditnej karte v prípade, ak","vyrovná celú dlžnú sumu do posledného dňa splatnosti","použil prostriedky karty výberom hotovosti na prepážke banky","použil prostriedky karty na bezhotovostné transakcie a vyrovná celú dlžnú sumu do posledného dňa v mesiaci nasledujúcom po lehote splatnosti","použil prostriedky karty na nákup tovaru v obchodoch, ktoré majú osobitné zmluvné dojednania s bankou, ktorá vystavila kreditnú kartu","použil prostriedky karty výberom hotovosti v zahraničí"],["Povolené prečerpanie je úver","krátkodobý, spojený s bežným účtom, klient môže zo svojho účtu platiť svoje záväzky aj vtedy, keď nemá na účte dostatok vlastných finančných prostriedkov","dlhodobý, spojený s účtom stavebného sporenia, banka úver poskytne v tom prípade, keď klient nasporí aspoň 50% z cieľovej sumy","krátkodobý a je spojený s refinančným úverom, klient môže čerpať úver z finančných prostriedkov centrálnej banky","strednodobý, spojený s lombardným úverom, klient ho môže čerpať až po splatení istiny z lombardného úveru","poskytovaný Národnou bankou Slovenska"],["Skimming je metóda","kopírovania platobných kariet, ktorá spadá medzi podvody s platobnými kartami","vydávania platobných kariet bankami","akceptovania platobných kariet v zahraničí","refinancovania viacerých úverov jedným úverom","akceptovania bianco zmenky"],["Phishing je","činnosť pri ktorej sa podvodník snaží vylákať od používateľov rôzne heslá, napr. údaje o platobnej karte, číslo platobnej karty, PIN kód a iné","nová forma vydávania debetných platobných kariet","nová forma preberania údajov z platobných kariet, aby transakcie boli bezpečnejšie","forma výmeny informácií o klientovi medzi bankami v rámci eurozóny","forma ručenia"],["Virtuálnu kreditnú kartu je možné využiť na","platby cez internet","výber hotovosti z bankomatu","výber hotovosti na pobočke banky","platbu prostredníctvom EFT POS","platby v zahraničí"],["Do výpočtu RPMN sa nezahrňuje/-jú","poplatky za  porušenie záväzkov vyplývajúcich spotrebiteľovi z úverovej zmluvy","poplatok za založenie a správu úveru","administratívne poplatky spojené s poskytnutím úveru","poistenie, ak je vyžadované veriteľom","úroková sadzba"],["Má banka výhradné právo na vlastné ocenenie nehnuteľnosti slúžiacej ako zabezpečenie hypotekárneho úveru?","áno","nie","nie, ak existuje ocenenie tejto nehnuteľnosti na základe Vyhlášky Ministerstva financií Slovenskej republiky o stanovení všeobecnej hodnoty majetku","nie, ak klient predloží ocenenie znaleckým posudkom vykonaného znalcom z Komory znalcov a znalecký posudok nie je starší ako 3 mesiace","áno, ak suma hypotekárneho úveru je vyššia ako 500 000 eur"],["Na liste vlastníctva k nehnuteľnosti, ktorá je predmetom záložného práva banky zriaďovaného na účely zabezpečenia poskytovaného úveru, nie je možné akceptovať","vecné bremeno práva dožitia","vecné bremeno práva vedenia inžinierskych sietí","záložné právo v prospech ostatných vlastníkov bytov a nebytových priestorov","vecné bremeno práva prechodu","vecné bremeno práva prejazdu"],["Ručenie vzniká","jednostranným písomným vyhlásením ručiteľa, že uspokojí veriteľa, ak dlžník nesplní určitý záväzok","jednostranným písomným vyhlásením veriteľa, že uspokojí dlžníka","dvojstranným písomným vyhlásením ručiteľa a veriteľa, že uspokojí veriteľa, ak dlžník nesplní určitý záväzok","až potom, čo ručiteľ dlžníka na riadne plnenie písomne vyzval a ten ani po tejto výzve svoj záväzok nesplnil","až potom, čo veriteľ dlžníka na riadne plnenie písomne vyzval a ten ani po tejto výzve svoj záväzok nesplnil"]]},{"id":"DDS","name":"Doplnkové dôchodkové sporenie","sub":"sektor DDS","q":[["Zamestnávateľ je povinný prispievať zamestnancom na doplnkové dôchodkové sporenie","ak ide o zamestnancov zaradených na základe orgánu štátnej správy na úseku verejného zdravotníctva do kategórie 3 alebo 4 a o zamestnancov, ktorí sú umelci vykonávajúci profesiu tanečníka alebo hráča na dychový nástroj","nemá takúto povinnosť","len zamestnancom vykonávajúcim prácu, ktorá je zaradená do kategórie 1","ak ide o zamestnancov vykonávajúcich prácu, ktorá je zaradená do kategórie 1 alebo 2 a o zamestnancov vykonávajúcich práce hráča na sláčikový nástroj","ak ide o zamestnancov vykonávajúcich prácu, ktorá je zaradená do kategórie 5 alebo 6 a o zamestnancov vykonávajúcich práce sólového umelca"],["Zákon o Sociálnom poistení sa nevzťahuje na","tzv. \"silové rezorty“","učiteľov a študentov","občanov, ktorí dosiahli dôchodkový vek","lekárov a zdravotné sestry","zamestnancov ministerstiev"],["Účastníkom doplnkového dôchodkového sporenia je","zamestnanec alebo fyzická osoba nad 18 rokov, ktorý/á uzatvoril/a účastnícku zmluvu","zamestnávateľ a Konfederácia odborových zväzov","zamestnanec a každá fyzická osoba od 15 rokov","zamestnanec a vybrané právnické osoby","zamestnanec, zamestnávateľ a doplnková dôchodková spoločnosť"],["Podmienky fungovania doplnkovej dôchodkovej spoločnosti upravuje","zákon o doplnkovom dôchodkovom sporení","zákon o doplnkovom dôchodkovom poistení","zákon o starobnom dôchodkovom sporení","zákon o kolektívnom investovaní","zákon o sociálnom poistení"],["Predmetom dedenia v doplnkovom dôchodkovom sporení je","aktuálna hodnota osobného účtu účastníka alebo osobného účtu poberateľa dočasného doplnkového starobného dôchodku, dočasného doplnkového výsluhového dôchodku, ak zomretý účastník alebo poberateľ tohto dočasného dôchodku v účastníckej zmluve neurčil ako oprávnenú osobu na vyplatenie aktuálnej hodnoty osobného účtu inú fyzickú alebo právnickú osobu","doživotný a dočasný doplnkový dôchodok, ak ich vypláca doplnková dôchodková spoločnosť","zostatková hodnota osobného účtu, ak nie je zápornej hodnoty","len dočasný doplnkový výsluhový dôchodok","výlučne aktuálna hodnota osobného účtu účastníka"],["Doplnková dôchodková spoločnosť zriadi a vedie","každému účastníkovi a každému poberateľovi dávky jeden osobný účet pre každú uzatvorenú účastnícku zmluvu","spoločný účet všetkým účastníkom a poberateľom dávok","každému účastníkovi a každému poberateľovi dávky jeho kontokorentný účet","zberný účet pre všetkých účastníkov a individuálny účet každému poberateľovi dávky","individuálny klientsky účet každému účastníkovi a hromadný účet všetkým poberateľom dávok"],["Sociálne poistenie podľa zákona o sociálnom poistení sa nevzťahuje na","príslušníkov Policajného zboru, Slovenskej informačnej služby, Národného bezpečnostného úradu, Zboru väzenskej a justičnej stráže, Hasičského a záchranného zboru, Horskej záchrannej služby, colníkov, profesionálnych vojakov a vojakov mimoriadnej služby","ústavných činiteľov a verejného ochrancu práv","samostatne zárobkovo činné osoby","zamestnancov tretieho sektora","zamestnancov ministerstiev"],["Účelom doplnkového dôchodkového sporenia je umožniť","účastníkovi získať doplnkový dôchodkový príjem v starobe","účastníkovi získať doplnkový príjem počas produktívneho obdobia","účastníkovi získať vyšší dôchodok od sociálnej poisťovne","sporiteľovi získať garantovaný príjem vo forme výplaty","sporiteľovi získať zásluhový dôchodok"],["Účelom doplnkového dôchodkového sporenia je aj umožniť","účastníkovi získať doplnkový dôchodkový príjem pri skončení výkonu tzv. rizikovej práce alebo skončení výkonu práce zamestnanca, ktorý vykonáva profesiu tanečníka alebo hráča na dychový nástroj","účastníkovi získať doplnkový príjem počas produktívneho obdobia","účastníkovi získať vyšší dôchodok od sociálnej poisťovne","sporiteľovi získať garantovaný príjem vo forme výplaty","sporiteľovi získať zásluhový dôchodok"],["Doplnkovým dôchodkovým sporením sa účastník zabezpečuje na starobu","dobrovoľne","povinne, ak je štátny zamestnanec","povinne, ak je príslušník silových rezortov","dobrovoľne, ak je zamestnanec, ktorý vykonáva práce tanečného umelca","dobrovoľne, ak je zamestnanec, ktorý vykonáva práce zaradené do rizikovej kategórie 3 alebo 4"],["V systéme dôchodkového zabezpečenia v Slovenskej republike, sa zvykne sociálne poistenie vykonávané Sociálnou poisťovňou označovať ako","I. pilier dôchodkového zabezpečenia","II. pilier dôchodkového zabezpečenia","III. pilier dôchodkového zabezpečenia","štátny pilier dôchodkového zabezpečenia","dobrovoľný pilier dôchodkového zabezpečenia"],["Potenciálny účastník je","záujemca o uzatvorenie zmluvy o doplnkovom dôchodkovom sporení s doplnkovou dôchodkovou spoločnosťou","účastník, ktorý ešte nedosiahol zákonný vek 18 rokov","takto sa nazýva účastník zahraničnej dôchodkovej spoločnosti","zamestnanec doplnkovej dôchodkovej spoločnosti zodpovedný za uzatváranie účastníckych zmlúv","zamestnanec, ktorý ešte neodpracoval potrebný počet rokov na uzatvorenie účastníckej zmluvy"],["Doplnkové dôchodkové sporenie je","zhromažďovanie príspevkov od účastníkov a zamestnávateľov, nakladanie s majetkom v doplnkovom dôchodkovom fonde a vyplácanie dávok doplnkového dô
